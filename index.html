<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- 화면 배율 고정 및 스크롤/확대 완벽 차단 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ESP32 펌프카 컨트롤러</title>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh; /* 화면에 딱 맞게 고정 */
            background-color: #121212; color: #fff;
            font-family: sans-serif;
            overflow: hidden; /* 화면 잘림 및 스크롤 방지 */
            touch-action: none; /* 아이폰 화면 당김(바운스) 방지 */
            display: flex; flex-direction: column;
        }

        /* 상단 상태 바 */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            height: 10vh; min-height: 40px; padding: 0 2vw;
            background-color: #1a1a1a; border-bottom: 1px solid #333;
        }
        .status { color: #00ff00; font-weight: bold; font-size: 1.2rem; }
        .btn-connect { background-color: #007aff; color: white; border: none; padding: 8px 16px; border-radius: 5px; font-weight: bold; }

        /* 중앙 조이스틱 영역 */
        .joystick-container {
            display: flex; justify-content: space-around; align-items: center;
            height: 50vh; padding: 1vw; gap: 2vw;
        }
        .joystick-box {
            flex: 1; height: 100%; background-color: #1e1e1e; border-radius: 10px;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            padding-top: 10px; position: relative; border: 1px solid #333;
        }
        
        /* 조이스틱 UI 더미 (여기에 nipple.js 등을 연결하세요) */
        .joystick-circle {
            width: 25vh; height: 25vh; border-radius: 50%; background-color: #111;
            border: 2px solid #555; position: absolute; top: 50%; transform: translateY(-50%);
            display: flex; justify-content: center; align-items: center;
        }
        .joystick-knob { width: 8vh; height: 8vh; border-radius: 50%; background-color: #ccc; box-shadow: inset -2px -2px 5px rgba(0,0,0,0.5); }

        /* 하단 버튼 및 다이얼 영역 */
        .control-panel {
            display: flex; justify-content: space-between; align-items: center;
            height: 40vh; padding: 1vw 2vw; background-color: #151515; border-top: 1px solid #333;
            gap: 1vw;
        }

        /* 하단 UI 요소들 */
        .side-btn { writing-mode: vertical-rl; text-orientation: upright; font-weight: bold; background-color: #34c759; border: none; border-radius: 5px; height: 90%; width: 5vw; min-width: 40px; }
        .side-btn.yellow { background-color: #ffcc00; color: black; }
        
        .btn-group { display: flex; flex-direction: column; gap: 5px; height: 100%; justify-content: center; }
        .btn { background-color: #333; color: white; border: none; padding: 1vh 2vw; border-radius: 5px; font-size: 0.8rem; }
        .btn.blue { background-color: #0a84ff; }
        .btn.red-big { background-color: #ff453a; border-radius: 50%; width: 12vh; height: 12vh; font-size: 1.2rem; font-weight: bold; box-shadow: 0 0 10px rgba(255,69,58,0.5); border: 2px solid white; }
        
        .dial-container { display: flex; flex-direction: column; align-items: center; }
        .dial { width: 7vh; height: 7vh; border-radius: 50%; border: 3px solid #ffcc00; position: relative; }
        .dial::after { content: ''; position: absolute; width: 2px; height: 50%; background: #ffcc00; top: 0; left: 50%; transform: translateX(-50%); }
    </style>
</head>
<body>

    <div class="header">
        <div class="status" id="statusText">연결 끊김</div>
        <button class="btn-connect" id="connectBtn">ESP32 연결하기</button>
    </div>

    <div class="joystick-container">
        <div class="joystick-box">
            <div style="color: #aaa; font-size: 0.9rem;">좌측 조이스틱 (4붐/5붐)</div>
            <div class="joystick-circle"><div class="joystick-knob"></div></div>
            <div style="position: absolute; bottom: 10px; color: #ffcc00; font-size: 0.9rem;">3붐 회전 (A5): 128</div>
        </div>
        <div class="joystick-box">
            <div style="color: #aaa; font-size: 0.9rem;">우측 조이스틱 (스윙/1붐)</div>
            <div class="joystick-circle"><div class="joystick-knob"></div></div>
            <div style="position: absolute; bottom: 10px; color: #ffcc00; font-size: 0.9rem;">2붐 회전 (A6): 128</div>
        </div>
    </div>

    <div class="control-panel">
        <button class="side-btn">START</button>
        
        <div class="btn-group">
            <button class="btn blue">BOOM</button>
            <button class="btn">OUT</button>
        </div>
        <div class="btn-group">
            <button class="btn" style="opacity: 0.5;">D9</button>
            <button class="btn" style="opacity: 0.5;">D12</button>
        </div>
        <div class="btn-group">
            <button class="btn">+ RPM</button>
            <button class="btn">- RPM</button>
        </div>
        
        <div class="dial-container">
            <div style="font-size: 0.7rem; color: #aaa; margin-bottom: 5px;">토출량(A8)</div>
            <div class="dial"></div>
            <div style="color: #ffcc00; margin-top: 5px; font-weight:bold;">128</div>
        </div>

        <button class="btn red-big">GSS</button>

        <div class="btn-group">
            <button class="btn">HORN</button>
            <button class="btn">JUMP</button>
        </div>
        <div class="btn-group">
            <button class="btn blue">정전</button>
            <button class="btn">역전</button>
        </div>

        <div class="dial-container">
            <div style="font-size: 0.7rem; color: #aaa; margin-bottom: 5px;">BOOM SPD</div>
            <div class="dial"></div>
            <div style="color: #ffcc00; margin-top: 5px; font-weight:bold;">128</div>
        </div>

        <div class="btn-group">
            <button class="btn">OPEN</button>
            <button class="btn">CLOSE</button>
        </div>

        <button class="side-btn yellow">MOTION</button>
    </div>

    <script>
        // 본인의 ESP32에 설정된 UUID로 변경하세요.
        const SERVICE_UUID = "YOUR-SERVICE-UUID-HERE"; 
        const CHARACTERISTIC_UUID = "YOUR-CHARACTERISTIC-UUID-HERE";

        let bleDevice = null;
        let bleServer = null;
        let customService = null;
        let txCharacteristic = null;

        const connectBtn = document.getElementById('connectBtn');
        const statusText = document.getElementById('statusText');

        connectBtn.addEventListener('click', async () => {
            if (bleDevice && bleDevice.gatt.connected) {
                disconnectDevice();
            } else {
                connectDevice();
            }
        });

        async function connectDevice() {
            try {
                statusText.innerText = "장치 찾는 중...";
                statusText.style.color = "#ffcc00";

                bleDevice = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true, //를 쓰거나 아래 filters 를 사용하세요.
                    //filters: [{ namePrefix: 'ESP32' }],
                    optionalServices: [SERVICE_UUID]
                });

                // 블루투스 연결이 끊어졌을 때의 이벤트 리스너 필수 등록
                bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

                statusText.innerText = "연결 시도 중...";
                
                bleServer = await bleDevice.gatt.connect();
                customService = await bleServer.getPrimaryService(SERVICE_UUID);
                txCharacteristic = await customService.getCharacteristic(CHARACTERISTIC_UUID);

                statusText.innerText = "연결됨";
                statusText.style.color = "#00ff00";
                connectBtn.innerText = "연결 해제";

                // TODO: 여기에 데이터 전송(Interval) 시작 함수를 호출하세요.

            } catch (error) {
                console.error("Connection Error:", error);
                statusText.innerText = "연결 실패";
                statusText.style.color = "#ff453a";
                resetBLEVariables();
            }
        }

        function disconnectDevice() {
            if (bleDevice && bleDevice.gatt.connected) {
                bleDevice.gatt.disconnect();
            }
        }

        function onDisconnected() {
            statusText.innerText = "연결 끊김 (재연결 대기)";
            statusText.style.color = "#ff453a";
            connectBtn.innerText = "ESP32 연결하기";
            resetBLEVariables();
            
            // TODO: 데이터 전송(Interval) 중지 함수 호출
        }

        function resetBLEVariables() {
            bleServer = null;
            customService = null;
            txCharacteristic = null;
        }

        // 데이터 전송 예시 함수 (필요 시 활용)
        async function sendData(dataArray) {
            if (!txCharacteristic) return;
            try {
                let data = new Uint8Array(dataArray);
                await txCharacteristic.writeValueWithoutResponse(data);
            } catch (error) {
                console.error("Send Error:", error);
            }
        }
    </script>
</body>
</html>
