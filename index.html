<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DY Concrete Pump Controller</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #121212;
            color: #fff;
            margin: 0;
            padding: 8px 15px;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        /* 상단 헤더 */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 36px;
            gap: 12px;
        }
        .status {
            padding: 6px 12px;
            border-radius: 6px;
            background: #2c2c2e;
            font-weight: bold;
            font-size: 13px;
            flex-grow: 1;
            text-align: center;
        }
        .connected { color: #30d158; }
        .disconnected { color: #ff453a; }
        
        button.conn-btn {
            background: #0a84ff;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            white-space: nowrap;
        }

        /* 메인 제어 영역 */
        .main-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: calc(100vh - 52px);
            width: 100%;
            gap: 12px;
        }

        .stick-panel {
            background: #1c1c1e;
            border: 2px solid #38383a;
            border-radius: 14px;
            padding: 8px;
            width: 48%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        .stick-title { font-size: 13px; font-weight: bold; }
        .left-title { color: #5ac8fa; }
        .right-title { color: #30d158; }

        .canvas-container {
            width: 100%;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none; /* 조이스틱 영역만 전역 터치 차단 */
        }

        canvas.joy-canvas {
            background: #2c2c2e;
            border-radius: 50%;
            border: 2px solid #545456;
            display: block;
        }

        /* 슬라이더 패널 (터치 수신 허용) */
        .slider-box {
            width: 95%;
            text-align: center;
            background: #252528;
            padding: 6px 10px;
            border-radius: 8px;
            touch-action: auto !important;
        }
        .slider-label {
            font-size: 11px;
            color: #ffd60a;
            font-weight: bold;
            margin-bottom: 2px;
        }
        input[type=range] {
            width: 100%;
            height: 28px;
            accent-color: #ffd60a;
            margin: 0;
            cursor: pointer;
            touch-action: pan-x !important;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <div id="status" class="status disconnected">BLE 미연결</div>
        <button class="conn-btn" onclick="connectBLE()">ESP32 연결하기</button>
    </div>

    <div class="main-controls">
        <!-- 좌측 조이스틱 패널 -->
        <div class="stick-panel">
            <div class="stick-title left-title">좌측 조이스틱 (4붐 / 5붐)</div>
            <div class="canvas-container">
                <canvas id="canvasLeft" class="joy-canvas"></canvas>
            </div>
            <div class="slider-box">
                <div class="slider-label">3붐 회전 (A5): <span id="valB3">128</span></div>
                <input type="range" id="sliderB3" min="0" max="255" value="128">
            </div>
        </div>

        <!-- 우측 조이스틱 패널 -->
        <div class="stick-panel">
            <div class="stick-title right-title">우측 조이스틱 (스윙 / 1붐)</div>
            <div class="canvas-container">
                <canvas id="canvasRight" class="joy-canvas"></canvas>
            </div>
            <div class="slider-box">
                <div class="slider-label">2붐 회전 (A6): <span id="valB2">128</span></div>
                <input type="range" id="sliderB2" min="0" max="255" value="128">
            </div>
        </div>
    </div>

    <script>
        const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

        let bleDevice = null;
        let gattCharacteristic = null;

        let packet = new Uint8Array([0, 0, 0, 0, 128, 128, 128, 128, 128, 128, 128, 128]);
        let sendTimer = null;
        const SEND_INTERVAL_MS = 50;

        async function connectBLE() {
            try {
                const statusDiv = document.getElementById("status");
                statusDiv.innerText = "기기 검색 중...";

                bleDevice = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [SERVICE_UUID]
                });

                statusDiv.innerText = "연결 중...";
                const server = await bleDevice.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                gattCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

                statusDiv.innerText = "DY Controller 연결됨";
                statusDiv.className = "status connected";

                bleDevice.addEventListener('gattserverdisconnected', onDisconnected);
                startPeriodicSend();
            } catch (error) {
                console.error(error);
                alert("연결 실패: " + error);
                document.getElementById("status").innerText = "연결 실패";
            }
        }

        function onDisconnected() {
            document.getElementById("status").innerText = "연결 끊김";
            document.getElementById("status").className = "status disconnected";
            stopPeriodicSend();
        }

        function startPeriodicSend() {
            if (sendTimer) clearInterval(sendTimer);
            sendTimer = setInterval(async () => {
                if (!gattCharacteristic) return;
                try {
                    await gattCharacteristic.writeValueWithoutResponse(packet);
                } catch (err) {
                    console.error("BLE 전송 오류:", err);
                }
            }, SEND_INTERVAL_MS);
        }

        function stopPeriodicSend() {
            if (sendTimer) { clearInterval(sendTimer); sendTimer = null; }
        }

        // --- 좌표 정밀 보정 멀티터치 조이스틱 ---
        class CorrectedTouchJoystick {
            constructor(canvasId, onMove) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                this.onMove = onMove;
                this.touchId = null;

                // 캔버스 크기 정밀 계산 및 이벤트 바인딩
                setTimeout(() => {
                    this.resizeCanvas();
                    this.draw();
                }, 100);

                this.initEvents();
            }

            resizeCanvas() {
                const container = this.canvas.parentElement;
                const size = Math.floor(Math.min(container.clientWidth * 0.85, container.clientHeight * 0.85));
                
                // 픽셀 1:1 보정 (무조건 우측 끝 쏠림 문제 해결)
                this.canvas.width = size;
                this.canvas.height = size;
                this.canvas.style.width = size + 'px';
                this.canvas.style.height = size + 'px';

                this.radius = size / 2;
                this.handleRadius = size * 0.18;
                this.x = this.radius;
                this.y = this.radius;
            }

            initEvents() {
                this.canvas.addEventListener('touchstart', (e) => {
                    if (this.touchId !== null) return;
                    e.preventDefault();

                    const touch = e.changedTouches[0];
                    this.touchId = touch.identifier;
                    this.updatePos(touch.clientX, touch.clientY);
                }, { passive: false });

                window.addEventListener('touchmove', (e) => {
                    if (this.touchId === null) return;

                    for (let i = 0; i < e.changedTouches.length; i++) {
                        if (e.changedTouches[i].identifier === this.touchId) {
                            e.preventDefault();
                            this.updatePos(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
                            break;
                        }
                    }
                }, { passive: false });

                const handleTouchEnd = (e) => {
                    if (this.touchId === null) return;

                    for (let i = 0; i < e.changedTouches.length; i++) {
                        if (e.changedTouches[i].identifier === this.touchId) {
                            this.touchId = null;
                            this.reset();
                            break;
                        }
                    }
                };

                window.addEventListener('touchend', handleTouchEnd);
                window.addEventListener('touchcancel', handleTouchEnd);
                window.addEventListener('resize', () => { this.resizeCanvas(); this.draw(); });
            }

            updatePos(clientX, clientY) {
                const rect = this.canvas.getBoundingClientRect();
                
                // 실제 화면 오프셋 정밀 반영
                let dx = clientX - (rect.left + this.radius);
                let dy = clientY - (rect.top + this.radius);
                
                const distance = Math.hypot(dx, dy);
                const maxDist = this.radius - this.handleRadius;

                if (distance > maxDist) {
                    dx = (dx / distance) * maxDist;
                    dy = (dy / distance) * maxDist;
                }

                this.x = this.radius + dx;
                this.y = this.radius + dy;
                this.draw();

                // 0 ~ 255 아날로그 값 정규화 (중립 128)
                const normX = dx / maxDist;
                const normY = dy / maxDist;
                const analogX = Math.min(255, Math.max(0, Math.round(128 + normX * 127)));
                const analogY = Math.min(255, Math.max(0, Math.round(128 + normY * 127)));

                this.onMove(analogX, analogY);
            }

            reset() {
                this.x = this.radius;
                this.y = this.radius;
                this.draw();
                this.onMove(128, 128);
            }

            draw() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                
                // 가이드선
                this.ctx.strokeStyle = '#48484a';
                this.ctx.lineWidth = 1;
                this.ctx.beginPath();
                this.ctx.moveTo(this.radius, 0); this.ctx.lineTo(this.radius, this.canvas.height);
                this.ctx.moveTo(0, this.radius); this.ctx.lineTo(this.canvas.width, this.radius);
                this.ctx.stroke();

                // 조이스틱 원
                this.ctx.beginPath();
                this.ctx.arc(this.x, this.y, this.handleRadius, 0, Math.PI * 2);
                this.ctx.fillStyle = (this.touchId !== null) ? '#0a84ff' : '#8e8e93';
                this.ctx.fill();
                this.ctx.strokeStyle = '#fff';
                this.ctx.lineWidth = 2;
                this.ctx.stroke();
            }
        }

        // --- 조이스틱 생성 ---
        const leftStick = new CorrectedTouchJoystick('canvasLeft', (x, y) => {
            packet[7] = x; // 4붐 (좌우)
            packet[8] = y; // 5붐 (상하)
        });

        const rightStick = new CorrectedTouchJoystick('canvasRight', (x, y) => {
            packet[5] = x; // 스윙 (좌우)
            packet[4] = y; // 1붐 (상하)
        });

        // --- 슬라이더 제어 (독립적 터치 처리) ---
        const sliderB3 = document.getElementById('sliderB3');
        const sliderB2 = document.getElementById('sliderB2');

        function updateSliderB3(val) {
            packet[9] = parseInt(val);
            document.getElementById('valB3').innerText = val;
        }

        function updateSliderB2(val) {
            packet[6] = parseInt(val);
            document.getElementById('valB2').innerText = val;
        }

        sliderB3.addEventListener('input', (e) => updateSliderB3(e.target.value));
        sliderB2.addEventListener('input', (e) => updateSliderB2(e.target.value));

        const resetSliderB3 = () => { sliderB3.value = 128; updateSliderB3(128); };
        const resetSliderB2 = () => { sliderB2.value = 128; updateSliderB2(128); };

        sliderB3.addEventListener('touchend', resetSliderB3);
        sliderB3.addEventListener('mouseup', resetSliderB3);
        sliderB2.addEventListener('touchend', resetSliderB2);
        sliderB2.addEventListener('mouseup', resetSliderB2);
    </script>
</body>
</html>
