<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DY Concrete Pump Remote Controller</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #121212;
            color: #fff;
            margin: 0;
            padding: 8px 12px;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        /* 상단 헤더 */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 32px;
            gap: 12px;
        }
        .status {
            padding: 4px 12px;
            border-radius: 6px;
            background: #2c2c2e;
            font-weight: bold;
            font-size: 13px;
            flex-grow: 1;
            text-align: center;
        }
        .connected { color: #30d158; }
        .disconnected { color: #ff453a; }
        
        button.conn-btn {
            background: #0a84ff;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
        }

        /* 메인 조이스틱 영역 */
        .main-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 48vh;
            width: 100%;
            gap: 10px;
        }

        .stick-panel {
            background: #1c1c1e;
            border: 2px solid #38383a;
            border-radius: 12px;
            padding: 6px;
            width: 49%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        .stick-title { font-size: 12px; font-weight: bold; }
        .left-title { color: #5ac8fa; }
        .right-title { color: #30d158; }

        .canvas-container {
            width: 100%;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
        }

        canvas.joy-canvas {
            background: #2c2c2e;
            border-radius: 50%;
            border: 2px solid #545456;
            display: block;
        }

        .slider-box {
            width: 95%;
            text-align: center;
            background: #252528;
            padding: 4px 8px;
            border-radius: 6px;
        }
        .slider-label { font-size: 10px; color: #ffd60a; font-weight: bold; }
        input[type=range] { width: 100%; height: 20px; accent-color: #ffd60a; margin: 0; }

        /* 하단 제어 패널 (도면 레이아웃 구현) */
        .bottom-panel {
            background: #1c1c1e;
            border: 2px solid #38383a;
            border-radius: 12px;
            padding: 8px 12px;
            height: 43vh;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        .panel-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .group-label {
            font-size: 10px;
            font-weight: bold;
            color: #8e8e93;
            text-align: center;
            height: 14px;
        }

        /* 토글/모멘터리 스위치 스타일 */
        .toggle-switch-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #2c2c2e;
            border: 1px solid #48484a;
            border-radius: 8px;
            padding: 6px 4px;
            width: 52px;
            gap: 4px;
        }

        .switch-btn {
            width: 40px;
            height: 28px;
            background: #3a3a3c;
            border: 1px solid #636366;
            border-radius: 4px;
            color: #fff;
            font-size: 10px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            touch-action: manipulation;
        }
        .switch-btn:active, .switch-btn.active {
            background: #30d158;
            color: #000;
        }

        .disabled-switch {
            opacity: 0.3;
            pointer-events: none;
        }

        /* GSS 비상정지 버튼 */
        .gss-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .gss-btn {
            width: 68px;
            height: 68px;
            background: radial-gradient(circle, #ff453a 60%, #990000 100%);
            border: 4px solid #fff;
            border-radius: 50%;
            color: white;
            font-weight: 900;
            font-size: 16px;
            box-shadow: 0 0 12px rgba(255, 69, 58, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .gss-btn:active {
            transform: scale(0.95);
            background: #d10000;
        }

        /* 가변 다이얼 노브 스티어링 */
        .knob-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 60px;
        }
        .knob {
            width: 52px;
            height: 52px;
            background: #2c2c2e;
            border: 3px solid #ffd60a;
            border-radius: 50%;
            position: relative;
            cursor: pointer;
            touch-action: none;
        }
        .knob-pointer {
            width: 4px;
            height: 20px;
            background: #ffd60a;
            position: absolute;
            top: 4px;
            left: 50%;
            transform: translateX(-50%);
            transform-origin: bottom center;
            border-radius: 2px;
        }
        .knob-val {
            font-size: 10px;
            color: #ffd60a;
            margin-top: 4px;
            font-weight: bold;
        }

        /* 오른쪽 Motion 버튼 */
        .motion-btn {
            background: #ff9f0a;
            border: 2px solid #fff;
            color: #000;
            font-size: 11px;
            font-weight: bold;
            padding: 10px 6px;
            border-radius: 6px;
            writing-mode: vertical-rl;
            text-orientation: upright;
            height: 80px;
        }
        .motion-btn:active { background: #d67a00; }
    </style>
</head>
<body>

    <div class="header-bar">
        <div id="status" class="status disconnected">BLE 미연결</div>
        <button class="conn-btn" onclick="connectBLE()">ESP32 연결하기</button>
    </div>

    <!-- 메인 조이스틱 영역 -->
    <div class="main-controls">
        <div class="stick-panel">
            <div class="stick-title left-title">좌측 조이스틱 (4붐/5붐)</div>
            <div class="canvas-container">
                <canvas id="canvasLeft" class="joy-canvas"></canvas>
            </div>
            <div class="slider-box">
                <div class="slider-label">3붐 회전 (A5): <span id="valB3">128</span></div>
                <input type="range" id="sliderB3" min="0" max="255" value="128">
            </div>
        </div>

        <div class="stick-panel">
            <div class="stick-title right-title">우측 조이스틱 (스윙/1붐)</div>
            <div class="canvas-container">
                <canvas id="canvasRight" class="joy-canvas"></canvas>
            </div>
            <div class="slider-box">
                <div class="slider-label">2붐 회전 (A6): <span id="valB2">128</span></div>
                <input type="range" id="sliderB2" min="0" max="255" value="128">
            </div>
        </div>
    </div>

    <!-- 하단 스위치 및 볼륨 제어 패널 (도면 1:1 대응) -->
    <div class="bottom-panel">
        
        <!-- D10 / D14 선택 스위치 -->
        <div class="panel-group">
            <div class="group-label">BOOM/OUT</div>
            <div class="toggle-switch-box">
                <button class="switch-btn" id="btnD10" mousedown="setBit(5, 0x02)" mouseup="clearBit(5, 0x02)">BOOM</button>
                <button class="switch-btn" id="btnD14" mousedown="setOutrigger(true)" mouseup="setOutrigger(false)">OUT</button>
            </div>
        </div>

        <!-- 미사용 스위치 (D9/D12) -->
        <div class="panel-group disabled-switch">
            <div class="group-label">N/A</div>
            <div class="toggle-switch-box">
                <div class="switch-btn">D9</div>
                <div class="switch-btn">D12</div>
            </div>
        </div>

        <!-- RPM 제어 (D2 / D3) -->
        <div class="panel-group">
            <div class="group-label">RPM</div>
            <div class="toggle-switch-box">
                <button class="switch-btn" id="btnD2" mousedown="setBit(4, 0x02)" mouseup="clearBit(4, 0x02)">+ RPM</button>
                <button class="switch-btn" id="btnD3" mousedown="setBit(4, 0x04)" mouseup="clearBit(4, 0x04)">- RPM</button>
            </div>
        </div>

        <!-- 토출량 볼륨 A8 -->
        <div class="knob-container">
            <div class="group-label">토출량(A8)</div>
            <div class="knob" id="knobA8">
                <div class="knob-pointer" id="pointerA8"></div>
            </div>
            <div class="knob-val" id="valA8">128</div>
        </div>

        <!-- GSS 비상 정지 -->
        <div class="gss-container">
            <div class="gss-btn" id="btnGSS" onclick="triggerGSS()">GSS</div>
        </div>

        <!-- 혼 / 점프 (D6 / D7) -->
        <div class="panel-group">
            <div class="group-label">HORN/JUMP</div>
            <div class="toggle-switch-box">
                <button class="switch-btn" id="btnD6" mousedown="setBit(4, 0x20)" mouseup="clearBit(4, 0x20)">HORN</button>
                <button class="switch-btn" id="btnD7">JUMP</button>
            </div>
        </div>

        <!-- 펌핑 (D4 / D5) -->
        <div class="panel-group">
            <div class="group-label">PUMP</div>
            <div class="toggle-switch-box">
                <button class="switch-btn" id="btnD4" mousedown="setBit(4, 0x08)" mouseup="clearBit(4, 0x08)">정전</button>
                <button class="switch-btn" id="btnD5" mousedown="setBit(4, 0x10)" mouseup="clearBit(4, 0x10)">역전</button>
            </div>
        </div>

        <!-- Boom Speed 볼륨 A9 -->
        <div class="knob-container">
            <div class="group-label">BOOM SPD</div>
            <div class="knob" id="knobA9">
                <div class="knob-pointer" id="pointerA9"></div>
            </div>
            <div class="knob-val" id="valA9">128</div>
        </div>

        <!-- End Hose Open / Close (D15 / D16) -->
        <div class="panel-group">
            <div class="group-label">END HOSE</div>
            <div class="toggle-switch-box">
                <button class="switch-btn" id="btnD15" mousedown="setBit(5, 0x40)" mouseup="clearBit(5, 0x40)">OPEN</button>
                <button class="switch-btn" id="btnD16" mousedown="setBit(5, 0x80)" mouseup="clearBit(5, 0x80)">CLOSE</button>
            </div>
        </div>

        <!-- Motion D8 -->
        <button class="motion-btn" id="btnD8" mousedown="setBit(4, 0x80)" mouseup="clearBit(4, 0x80)">MOTION</button>

    </div>

    <script>
        const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

        let bleDevice = null;
        let gattCharacteristic = null;

        // Byte1 ~ Byte12 BLE 패킷 배열
        let packet = new Uint8Array([0, 0, 0, 0, 0, 0, 128, 128, 128, 128, 128, 128]);
        let sendTimer = null;

        async function connectBLE() {
            try {
                const statusDiv = document.getElementById("status");
                statusDiv.innerText = "기기 검색 중...";

                bleDevice = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [SERVICE_UUID]
                });

                statusDiv.innerText = "연결 중...";
                const server = await bleDevice.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                gattCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

                statusDiv.innerText = "DY Controller 연결됨";
                statusDiv.className = "status connected";

                bleDevice.addEventListener('gattserverdisconnected', onDisconnected);
                startPeriodicSend();
            } catch (error) {
                console.error(error);
                alert("연결 실패: " + error);
                document.getElementById("status").innerText = "연결 실패";
            }
        }

        function onDisconnected() {
            document.getElementById("status").innerText = "연결 끊김";
            document.getElementById("status").className = "status disconnected";
            if (sendTimer) clearInterval(sendTimer);
        }

        function startPeriodicSend() {
            if (sendTimer) clearInterval(sendTimer);
            sendTimer = setInterval(async () => {
                if (!gattCharacteristic) return;
                try {
                    await gattCharacteristic.writeValueWithoutResponse(packet);
                } catch (err) {
                    console.error("BLE 전송 오류:", err);
                }
            }, 50);
        }

        /* 비트 제어 헬퍼 함수 */
        function setBit(byteIdx, bitMask) {
            packet[byteIdx - 1] |= bitMask;
        }

        function clearBit(byteIdx, bitMask) {
            packet[byteIdx - 1] &= ~bitMask;
        }

        function setOutrigger(active) {
            if (active) {
                packet[4] |= 0x20; // Byte5 Outrigger 비트
                // Outrigger 활성화 시 Byte 7~12 채널 0x7F 기본값 설정
                for (let i = 6; i < 12; i++) packet[i] = 0x7F;
            } else {
                packet[4] &= ~0x20;
            }
        }

        function triggerGSS() {
            alert("비상정지(GSS)가 작동되었습니다.");
            packet.fill(0);
            packet[6] = 128; packet[7] = 128; packet[8] = 128;
            packet[9] = 128; packet[10] = 128; packet[11] = 128;
        }

        // 터치/마우스 모멘터리 버튼 이벤터 리스너 설정
        function bindMomentary(id, onDown, onUp) {
            const el = document.getElementById(id);
            if (!el) return;

            const handleDown = (e) => { e.preventDefault(); el.classList.add('active'); onDown(); };
            const handleUp = (e) => { e.preventDefault(); el.classList.remove('active'); onUp(); };

            el.addEventListener('mousedown', handleDown);
            el.addEventListener('mouseup', handleUp);
            el.addEventListener('touchstart', handleDown);
            el.addEventListener('touchend', handleUp);
        }

        bindMomentary('btnD10', () => setBit(5, 0x02), () => clearBit(5, 0x02));
        bindMomentary('btnD14', () => setOutrigger(true), () => setOutrigger(false));
        bindMomentary('btnD2', () => setBit(4, 0x02), () => clearBit(4, 0x02));
        bindMomentary('btnD3', () => setBit(4, 0x04), () => clearBit(4, 0x04));
        bindMomentary('btnD6', () => setBit(4, 0x20), () => clearBit(4, 0x20));
        bindMomentary('btnD4', () => setBit(4, 0x08), () => clearBit(4, 0x08));
        bindMomentary('btnD5', () => setBit(4, 0x10), () => clearBit(4, 0x10));
        bindMomentary('btnD15', () => setBit(5, 0x40), () => clearBit(5, 0x40));
        bindMomentary('btnD16', () => setBit(5, 0x80), () => clearBit(5, 0x80));
        bindMomentary('btnD8', () => setBit(4, 0x80), () => clearBit(4, 0x80));

        /* 가변 다이얼 Knob 제어 클래스 */
        class DialKnob {
            constructor(knobId, pointerId, valId, byteIndex) {
                this.knob = document.getElementById(knobId);
                this.pointer = document.getElementById(pointerId);
                this.valDisplay = document.getElementById(valId);
                this.byteIndex = byteIndex;
                this.angle = 0; // -135deg ~ 135deg

                this.initEvents();
            }

            initEvents() {
                const updateKnob = (clientX, clientY) => {
                    const rect = this.knob.getBoundingClientRect();
                    const centerX = rect.left + rect.width / 2;
                    const centerY = rect.top + rect.height / 2;

                    let rad = Math.atan2(clientY - centerY, clientX - centerX);
                    let deg = rad * (180 / Math.PI) + 90;

                    if (deg > 180) deg -= 360;
                    deg = Math.max(-135, Math.min(135, deg));

                    this.pointer.style.transform = `translateX(-50%) rotate(${deg}deg)`;
                    
                    // -135~135 도각을 128~255 (0x80~0xFF) 범위로 스케일링
                    const norm = (deg + 135) / 270;
                    const val = Math.round(128 + norm * 127);
                    
                    this.valDisplay.innerText = val;
                    packet[this.byteIndex - 1] = val;
                };

                const onMove = (e) => {
                    const touch = e.touches ? e.touches[0] : e;
                    updateKnob(touch.clientX, touch.clientY);
                };

                this.knob.addEventListener('mousedown', () => {
                    window.addEventListener('mousemove', onMove);
                    window.addEventListener('mouseup', () => window.removeEventListener('mousemove', onMove), { once: true });
                });

                this.knob.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    window.addEventListener('touchmove', onMove);
                    window.addEventListener('touchend', () => window.removeEventListener('touchmove', onMove), { once: true });
                });
            }
        }

        const knobA8 = new DialKnob('knobA8', 'pointerA8', 'valA8', 12); // Byte 12 (토출량)
        const knobA9 = new DialKnob('knobA9', 'pointerA9', 'valA9', 11); // Byte 11 (Boom Speed)

        /* 조이스틱 구현 클래스 */
        class CorrectedTouchJoystick {
            constructor(canvasId, onMove) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                this.onMove = onMove;
                this.touchId = null;

                setTimeout(() => { this.resizeCanvas(); this.draw(); }, 100);
                this.initEvents();
            }

            resizeCanvas() {
                const container = this.canvas.parentElement;
                const size = Math.floor(Math.min(container.clientWidth * 0.85, container.clientHeight * 0.85));
                this.canvas.width = size;
                this.canvas.height = size;
                this.canvas.style.width = size + 'px';
                this.canvas.style.height = size + 'px';

                this.radius = size / 2;
                this.handleRadius = size * 0.18;
                this.x = this.radius;
                this.y = this.radius;
            }

            initEvents() {
                this.canvas.addEventListener('touchstart', (e) => {
                    if (this.touchId !== null) return;
                    e.preventDefault();
                    const touch = e.changedTouches[0];
                    this.touchId = touch.identifier;
                    this.updatePos(touch.clientX, touch.clientY);
                }, { passive: false });

                window.addEventListener('touchmove', (e) => {
                    if (this.touchId === null) return;
                    for (let i = 0; i < e.changedTouches.length; i++) {
                        if (e.changedTouches[i].identifier === this.touchId) {
                            e.preventDefault();
                            this.updatePos(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
                            break;
                        }
                    }
                }, { passive: false });

                const handleTouchEnd = (e) => {
                    if (this.touchId === null) return;
                    for (let i = 0; i < e.changedTouches.length; i++) {
                        if (e.changedTouches[i].identifier === this.touchId) {
                            this.touchId = null;
                            this.reset();
                            break;
                        }
                    }
                };

                window.addEventListener('touchend', handleTouchEnd);
                window.addEventListener('touchcancel', handleTouchEnd);
                window.addEventListener('resize', () => { this.resizeCanvas(); this.draw(); });
            }

            updatePos(clientX, clientY) {
                const rect = this.canvas.getBoundingClientRect();
                let dx = clientX - (rect.left + this.radius);
                let dy = clientY - (rect.top + this.radius);
                const distance = Math.hypot(dx, dy);
                const maxDist = this.radius - this.handleRadius;

                if (distance > maxDist) {
                    dx = (dx / distance) * maxDist;
                    dy = (dy / distance) * maxDist;
                }

                this.x = this.radius + dx;
                this.y = this.radius + dy;
                this.draw();

                const normX = dx / maxDist;
                const normY = dy / maxDist;
                const analogX = Math.min(255, Math.max(0, Math.round(128 + normX * 127)));
                const analogY = Math.min(255, Math.max(0, Math.round(128 + normY * 127)));

                this.onMove(analogX, analogY);
            }

            reset() {
                this.x = this.radius;
                this.y = this.radius;
                this.draw();
                this.onMove(128, 128);
            }

            draw() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                this.ctx.strokeStyle = '#48484a';
                this.ctx.lineWidth = 1;
                this.ctx.beginPath();
                this.ctx.moveTo(this.radius, 0); this.ctx.lineTo(this.radius, this.canvas.height);
                this.ctx.moveTo(0, this.radius); this.ctx.lineTo(this.canvas.width, this.radius);
                this.ctx.stroke();

                this.ctx.beginPath();
                this.ctx.arc(this.x, this.y, this.handleRadius, 0, Math.PI * 2);
                this.ctx.fillStyle = (this.touchId !== null) ? '#0a84ff' : '#8e8e93';
                this.ctx.fill();
                this.ctx.strokeStyle = '#fff';
                this.ctx.lineWidth = 2;
                this.ctx.stroke();
            }
        }

        const leftStick = new CorrectedTouchJoystick('canvasLeft', (x, y) => {
            packet[7] = x; // 4붐 (Byte 8)
            packet[5] = y; // 5붐 (Byte 6)
        });

        const rightStick = new CorrectedTouchJoystick('canvasRight', (x, y) => {
            packet[8] = x; // Swing (Byte 9)
            packet[6] = y; // 1붐 (Byte 7)
        });

        const sliderB3 = document.getElementById('sliderB3');
        const sliderB2 = document.getElementById('sliderB2');

        sliderB3.addEventListener('input', (e) => {
            packet[9] = parseInt(e.target.value); // 3붐 (Byte 10)
            document.getElementById('valB3').innerText = e.target.value;
        });

        sliderB2.addEventListener('input', (e) => {
            packet[10] = parseInt(e.target.value); // 2붐 (Byte 11)
            document.getElementById('valB2').innerText = e.target.value;
        });

        const resetSliderB3 = () => { sliderB3.value = 128; packet[9] = 128; document.getElementById('valB3').innerText = 128; };
        const resetSliderB2 = () => { sliderB2.value = 128; packet[10] = 128; document.getElementById('valB2').innerText = 128; };

        sliderB3.addEventListener('touchend', resetSliderB3);
        sliderB3.addEventListener('mouseup', resetSliderB3);
        sliderB2.addEventListener('touchend', resetSliderB2);
        sliderB2.addEventListener('mouseup', resetSliderB2);
    </script>
</body>
</html>
