<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>DY Concrete Pump Analog Joystick</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #121212; color: #fff; text-align: center; margin: 0; padding: 10px; user-select: none; touch-action: none; }
        .status { padding: 8px; margin-bottom: 10px; border-radius: 8px; background: #2c2c2e; font-weight: bold; font-size: 13px; }
        .connected { color: #30d158; }
        .disconnected { color: #ff453a; }
        button.conn-btn { background: #0a84ff; color: white; border: none; padding: 10px; border-radius: 8px; font-size: 14px; font-weight: bold; width: 100%; max-width: 400px; margin-bottom: 10px; }
        
        .joystick-container { display: flex; justify-content: space-around; gap: 10px; flex-wrap: wrap; }
        .stick-box { background: #1c1c1e; border: 2px solid #38383a; border-radius: 12px; padding: 10px; width: 48%; min-width: 165px; box-sizing: border-box; }
        .stick-title { font-size: 13px; font-weight: bold; margin-bottom: 8px; }
        .left-title { color: #5ac8fa; }
        .right-title { color: #30d158; }
        
        /* 2D 조이스틱 캔버스 */
        canvas.joy-canvas { background: #2c2c2e; border-radius: 50%; border: 2px solid #545456; touch-action: none; display: block; margin: 0 auto; }
        
        /* 아날로그 슬라이더 */
        .slider-box { margin-top: 12px; text-align: center; }
        .slider-label { font-size: 11px; color: #ffd60a; margin-bottom: 4px; font-weight: bold; }
        input[type=range] { width: 90%; accent-color: #ffd60a; }
    </style>
</head>
<body>

    <div id="status" class="status disconnected">BLE 미연결</div>
    <button class="conn-btn" onclick="connectBLE()">ESP32 연결하기</button>

    <div class="joystick-container">
        <!-- 좌측 3축 아날로그 조이스틱 -->
        <div class="stick-box">
            <div class="stick-title left-title">좌측 조이스틱 (4붐 / 5붐)</div>
            <canvas id="canvasLeft" class="joy-canvas" width="140" height="140"></canvas>
            <div class="slider-box">
                <div class="slider-label">3붐 회전 (A5): <span id="valB3">128</span></div>
                <input type="range" id="sliderB3" min="0" max="255" value="128" oninput="updateB3(this.value)" ontouchend="resetB3()" onmouseup="resetB3()">
            </div>
        </div>

        <!-- 우측 3축 아날로그 조이스틱 -->
        <div class="stick-box">
            <div class="stick-title right-title">우측 조이스틱 (스윙 / 1붐)</div>
            <canvas id="canvasRight" class="joy-canvas" width="140" height="140"></canvas>
            <div class="slider-box">
                <div class="slider-label">2붐 회전 (A6): <span id="valB2">128</span></div>
                <input type="range" id="sliderB2" min="0" max="255" value="128" oninput="updateB2(this.value)" ontouchend="resetB2()" onmouseup="resetB2()">
            </div>
        </div>
    </div>

    <script>
        const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

        let bleDevice = null;
        let gattCharacteristic = null;

        // TPDO 12바이트 패킷 (기본 128 아날로그 중립)
        let packet = new Uint8Array([0, 0, 0, 0, 128, 128, 128, 128, 128, 128, 128, 128]);
        let sendTimer = null;
        const SEND_INTERVAL_MS = 50; // 50ms (초당 20회 연속 전송)

        async function connectBLE() {
            try {
                const statusDiv = document.getElementById("status");
                statusDiv.innerText = "기기 검색 중...";

                bleDevice = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [SERVICE_UUID]
                });

                statusDiv.innerText = "연결 중...";
                const server = await bleDevice.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                gattCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

                statusDiv.innerText = "DY PumpController 연결됨";
                statusDiv.className = "status connected";

                bleDevice.addEventListener('gattserverdisconnected', onDisconnected);
                startPeriodicSend();
            } catch (error) {
                console.error(error);
                alert("연결 실패: " + error);
                document.getElementById("status").innerText = "연결 실패";
            }
        }

        function onDisconnected() {
            document.getElementById("status").innerText = "연결 끊김";
            document.getElementById("status").className = "status disconnected";
            stopPeriodicSend();
        }

        function startPeriodicSend() {
            if (sendTimer) clearInterval(sendTimer);
            sendTimer = setInterval(async () => {
                if (!gattCharacteristic) return;
                try {
                    await gattCharacteristic.writeValueWithoutResponse(packet);
                } catch (err) {
                    console.error("BLE 전송 오류:", err);
                }
            }, SEND_INTERVAL_MS);
        }

        function stopPeriodicSend() {
            if (sendTimer) { clearInterval(sendTimer); sendTimer = null; }
        }

        // --- 아날로그 조이스틱 Canvas 터치 제어 클래스 ---
        class AnalogStick {
            constructor(canvasId, onMove) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                this.radius = this.canvas.width / 2;
                this.handleRadius = 22;
                this.x = this.radius;
                this.y = this.radius;
                this.active = false;
                this.onMove = onMove;

                this.initEvents();
                this.draw();
            }

            initEvents() {
                const handleStart = (e) => { this.active = true; this.updatePos(e); };
                const handleMove = (e) => { if (this.active) this.updatePos(e); };
                const handleEnd = () => { this.active = false; this.reset(); };

                this.canvas.addEventListener('touchstart', handleStart, {passive: false});
                this.canvas.addEventListener('touchmove', handleMove, {passive: false});
                this.canvas.addEventListener('touchend', handleEnd);
                this.canvas.addEventListener('mousedown', handleStart);
                window.addEventListener('mousemove', handleMove);
                window.addEventListener('mouseup', handleEnd);
            }

            updatePos(e) {
                e.preventDefault();
                const rect = this.canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                let dx = clientX - (rect.left + this.radius);
                let dy = clientY - (rect.top + this.radius);
                const distance = Math.hypot(dx, dy);
                const maxDist = this.radius - this.handleRadius;

                if (distance > maxDist) {
                    dx = (dx / distance) * maxDist;
                    dy = (dy / distance) * maxDist;
                }

                this.x = this.radius + dx;
                this.y = this.radius + dy;
                this.draw();

                // -1.0 ~ +1.0 정규화 후 0 ~ 255 아날로그 값으로 매핑
                const normX = dx / maxDist;
                const normY = dy / maxDist;
                const analogX = Math.round(128 + normX * 127);
                const analogY = Math.round(128 + normY * 127);

                this.onMove(analogX, analogY);
            }

            reset() {
                this.x = this.radius;
                this.y = this.radius;
                this.draw();
                this.onMove(128, 128); // 중립 복귀
            }

            draw() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                
                // 배경 가이드선
                this.ctx.strokeStyle = '#48484a';
                this.ctx.lineWidth = 1;
                this.ctx.beginPath();
                this.ctx.moveTo(this.radius, 0); this.ctx.lineTo(this.radius, this.canvas.height);
                this.ctx.moveTo(0, this.radius); this.ctx.lineTo(this.canvas.width, this.radius);
                this.ctx.stroke();

                // 조이스틱 핸들
                this.ctx.beginPath();
                this.ctx.arc(this.x, this.y, this.handleRadius, 0, Math.PI * 2);
                this.ctx.fillStyle = this.active ? '#0a84ff' : '#8e8e93';
                this.ctx.fill();
                this.ctx.strokeStyle = '#fff';
                this.ctx.lineWidth = 2;
                this.ctx.stroke();
            }
        }

        // --- 조이스틱 매핑 초기화 ---
        
        // 1. 좌측 조이스틱 (X: 4붐 / Y: 5붐)
        const leftStick = new AnalogStick('canvasLeft', (x, y) => {
            packet[7] = x; // A2 (4붐: 0~255)
            packet[8] = y; // A1 (5붐: 0~255)
        });

        // 2. 우측 조이스틱 (X: 스윙 / Y: 1붐)
        const rightStick = new AnalogStick('canvasRight', (x, y) => {
            packet[5] = x; // A4 (스윙: 0~255)
            packet[4] = y; // A3 (1붐: 0~255)
        });

        // 3. 3붐 (좌측 Z축 회전)
        function updateB3(val) {
            packet[9] = parseInt(val);
            document.getElementById('valB3').innerText = val;
        }
        function resetB3() {
            document.getElementById('sliderB3').value = 128;
            updateB3(128);
        }

        // 4. 2붐 (우측 Z축 회전)
        function updateB2(val) {
            packet[6] = parseInt(val);
            document.getElementById('valB2').innerText = val;
        }
        function resetB2() {
            document.getElementById('sliderB2').value = 128;
            updateB2(128);
        }
    </script>
</body>
</html>
