<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DY Concrete Pump Controller</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: none;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            position: fixed;
            top: 0;
            left: 0;
            overflow: hidden;
            background-color: #121214;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .app-root {
            display: flex;
            width: 100%;
            height: 100%;
            padding: calc(4px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right)) calc(4px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left));
            box-sizing: border-box;
            gap: 8px;
        }

        .main-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
        }

        .side-panel {
            width: 52px;
            display: flex;
            flex-direction: column;
        }

        .btn-d8-motion {
            flex: 1;
            background: #ff9500;
            color: #ffffff;
            border: 2px solid #ffcc00;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            display: flex;
            align-items: center;
            justify-content: center;
            letter-spacing: 2px;
            box-shadow: 0 0 10px rgba(255, 149, 0, 0.4);
        }
        .btn-d8-motion.active {
            background: #cc7700;
            box-shadow: 0 0 16px rgba(255, 204, 0, 0.8);
            transform: scale(0.97);
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 32px;
            background: #1e1e22;
            border-radius: 6px;
            padding: 0 10px;
            flex-shrink: 0;
        }

        .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .status-text { font-weight: bold; font-size: 12px; color: #ff453a; }
        .status-text.connected { color: #30d158; }

        .btn-connect {
            background-color: #0a84ff;
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
        }

        .btn-start-d1 {
            background-color: #30d158;
            color: black;
            border: none;
            padding: 4px 12px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
            box-shadow: 0 0 6px rgba(48, 209, 88, 0.5);
        }
        .btn-start-d1.active {
            background-color: #248a3d;
            color: white;
        }

        .joystick-section {
            display: flex;
            gap: 8px;
            flex: 1.1;
            min-height: 0;
        }

        .joystick-card {
            flex: 1;
            background: #1c1c20;
            border: 1px solid #2c2c32;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly;
            padding: 4px;
        }

        .card-title { font-size: 11px; color: #0a84ff; font-weight: bold; }

        .stick-area {
            width: 84px;
            height: 84px;
            border-radius: 50%;
            background: #282830;
            border: 2px solid #3a3a45;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stick-handle {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: radial-gradient(circle, #e5e5ea 0%, #8e8e93 100%);
            border: 2px solid #ffffff;
            position: absolute;
            box-shadow: 0 3px 6px rgba(0,0,0,0.5);
            pointer-events: none;
        }

        .slider-box {
            width: 92%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .slider-label { font-size: 10px; color: #ffd60a; margin-bottom: 2px; }
        .custom-slider { width: 100%; height: 16px; accent-color: #ffd60a; }

        .control-panel {
            flex: 0.9;
            min-height: 0;
            background: #1c1c20;
            border: 1px solid #2c2c32;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 4px 6px;
        }

        .group-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }

        .group-title { font-size: 9px; color: #8e8e93; font-weight: bold; }

        .btn-ctrl {
            width: 42px;
            height: 28px;
            background: #2c2c32;
            color: #ccc;
            border: 1px solid #44444e;
            border-radius: 5px;
            font-size: 10px;
            font-weight: bold;
        }

        .btn-ctrl.active {
            background: #0a84ff;
            color: #ffffff;
            border-color: #64d2ff;
            box-shadow: 0 0 8px rgba(10, 132, 255, 0.6);
        }

        .knob-container {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 2px solid #ffd60a;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: #282830;
            cursor: pointer;
        }
        .knob-pointer {
            width: 2px;
            height: 13px;
            background: #ffd60a;
            position: absolute;
            top: 2px;
            border-radius: 1px;
            transform-origin: bottom center;
            transform: rotate(-135deg);
        }
        .knob-val { font-size: 9px; color: #ffd60a; font-weight: bold; }
    </style>
</head>
<body>

<div class="app-root">
    <div class="main-panel">
        <div class="header-bar">
            <div id="status" class="status-text">BLE 미연결</div>
            <div class="header-actions">
                <button class="btn-start-d1" id="btnStartD1">AIR CUFF (D1)</button>
                <button class="btn-connect" onclick="connectBLE()">ESP32 연결하기</button>
            </div>
        </div>

        <div class="joystick-section">
            <div class="joystick-card">
                <div class="card-title">좌측 조이스틱 (L3/L2)</div>
                <div class="stick-area" id="areaLeft">
                    <div class="stick-handle" id="stickLeft"></div>
                </div>
                <div class="slider-box">
                    <div class="slider-label" id="lblA5">3붐 제어 (L2): 128</div>
                    <input type="range" id="sliderA5" class="custom-slider" min="0" max="255" value="128">
                </div>
            </div>

            <div class="joystick-card">
                <div class="card-title">우측 조이스틱 (R3/R2)</div>
                <div class="stick-area" id="areaRight">
                    <div class="stick-handle" id="stickRight"></div>
                </div>
                <div class="slider-box">
                    <div class="slider-label" id="lblA6">2붐 제어 (R2): 128</div>
                    <input type="range" id="sliderA6" class="custom-slider" min="0" max="255" value="128">
                </div>
            </div>
        </div>

        <div class="control-panel">
            <div class="group-box">
                <div class="group-title">BOOM/OUT</div>
                <button class="btn-ctrl active" id="btnBoom">BOOM</button>
                <button class="btn-ctrl" id="btnOut">OUT</button>
            </div>

            <div class="group-box">
                <div class="group-title">RPM</div>
                <button class="btn-ctrl" id="btnRpmPlus">+ RPM</button>
                <button class="btn-ctrl" id="btnRpmMinus">- RPM</button>
            </div>

            <div class="group-box">
                <div class="group-title">토출량</div>
                <div class="knob-container" id="knobA8"><div class="knob-pointer" id="ptrA8"></div></div>
                <div class="knob-val" id="valA8">128</div>
            </div>

            <div class="group-box">
                <div class="group-title">기능</div>
                <button class="btn-ctrl" id="btnHorn">HORN</button>
                <button class="btn-ctrl" id="btnStroke">행정변환</button>
            </div>

            <div class="group-box">
                <div class="group-title">PUMP</div>
                <button class="btn-ctrl" id="btnPumpFwd">정전</button>
                <button class="btn-ctrl" id="btnPumpRev">역전</button>
            </div>

            <div class="group-box">
                <div class="group-title">END HOSE</div>
                <button class="btn-ctrl" id="btnHoseOpen">OPEN</button>
                <button class="btn-ctrl" id="btnHoseClose">CLOSE</button>
            </div>
        </div>
    </div>

    <div class="side-panel">
        <button class="btn-d8-motion" id="btnMotionD8">MOTION CONTROL (D8)</button>
    </div>
</div>

<script>
    const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
    const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

    let bleDevice = null;
    let gattCharacteristic = null;
    let sendIntervalTimer = null;
    let isSending = false;

    // 12바이트 TPDO 데이터 구조 (Byte 1 ~ Byte 12 -> packet[0] ~ packet[11])
    let packet = new Uint8Array(12);
    packet[0] = 0x00; // Byte 1 (TPDO1 Byte 1)
    packet[1] = 0x00; // Byte 2 (TPDO1 Byte 2)
    packet[2] = 0x00; // Byte 3 (TPDO1 Byte 3)
    packet[3] = 0x02; // Byte 4 (TPDO1 Byte 4) -> 기본값을 BOOM 모드(0x02)로 설정
    
    // Byte 5 ~ 12 (TPDO2 / TPDO3 - 아날로그 중립 128 = 0x80)
    packet.fill(128, 4, 12);

    async function connectBLE() {
        try {
            const statusDiv = document.getElementById("status");
            statusDiv.innerText = "검색 중...";

            bleDevice = await navigator.bluetooth.requestDevice({
                acceptAllDevices: true,
                optionalServices: [SERVICE_UUID]
            });

            statusDiv.innerText = "연결 중...";
            const server = await bleDevice.gatt.connect();
            const service = await server.getPrimaryService(SERVICE_UUID);
            gattCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

            statusDiv.innerText = "연결됨 (40ms)";
            statusDiv.className = "status-text connected";

            startSendingLoop();

            bleDevice.addEventListener('gattserverdisconnected', () => {
                statusDiv.innerText = "BLE 연결 끊김";
                statusDiv.className = "status-text";
                stopSendingLoop();
            });
        } catch (error) {
            alert("BLE 연결 실패: " + error);
        }
    }

    function startSendingLoop() {
        if (sendIntervalTimer) clearInterval(sendIntervalTimer);
        // 40ms 주기 전송
        sendIntervalTimer = setInterval(async () => {
            if (!gattCharacteristic || isSending) return;
            try {
                isSending = true;
                await gattCharacteristic.writeValueWithoutResponse(packet);
            } catch (e) {
                console.error("전송 에러:", e);
            } finally {
                isSending = false;
            }
        }, 40);
    }

    function stopSendingLoop() {
        if (sendIntervalTimer) {
            clearInterval(sendIntervalTimer);
            sendIntervalTimer = null;
        }
    }

    // --- 좌측 조이스틱 (L3: Byte 5/6 - 5붐, 4붐) ---
    function setupLeftJoystick() {
        const area = document.getElementById('areaLeft');
        const stick = document.getElementById('stickLeft');
        const maxRadius = 24;

        function updateStick(e) {
            const touch = e.touches[0];
            const rect = area.getBoundingClientRect();
            const deltaX = touch.clientX - (rect.left + rect.width / 2);
            const deltaY = touch.clientY - (rect.top + rect.height / 2);
            const dist = Math.hypot(deltaX, deltaY);

            let normX = deltaX / maxRadius;
            let normY = deltaY / maxRadius;
            if (dist > maxRadius) {
                normX /= (dist / maxRadius);
                normY /= (dist / maxRadius);
            }

            stick.style.transform = `translate(${normX * maxRadius}px, ${normY * maxRadius}px)`;

            const valX = Math.round((normX + 1) * 127.5); // 4붐
            const valY = Math.round((normY + 1) * 127.5); // 5붐

            packet[5] = valX; // Byte 6 (TPDO2 Byte 6)
            packet[4] = valY; // Byte 5 (TPDO2 Byte 5)

            // 5붐 상/하 (Byte 1: Bit 0=상승(0x01), Byte 2: Bit 0=하강(0x01))
            if (valY < 80) { packet[0] |= 0x01; packet[1] &= ~0x01; }
            else if (valY > 175) { packet[1] |= 0x01; packet[0] &= ~0x01; }
            else { packet[0] &= ~0x01; packet[1] &= ~0x01; }

            // 4붐 상/하 (Byte 1: Bit 1=상승(0x02), Byte 2: Bit 1=하강(0x02))
            if (valX > 175) { packet[0] |= 0x02; packet[1] &= ~0x02; }
            else if (valX < 80) { packet[1] |= 0x02; packet[0] &= ~0x02; }
            else { packet[0] &= ~0x02; packet[1] &= ~0x02; }
        }

        function resetStick() {
            stick.style.transform = `translate(0px, 0px)`;
            packet[4] = 128; // Byte 5
            packet[5] = 128; // Byte 6
            packet[0] &= ~0x03; // Byte 1 비트 해제
            packet[1] &= ~0x03; // Byte 2 비트 해제
        }

        area.addEventListener('touchstart', (e) => { e.preventDefault(); updateStick(e); });
        area.addEventListener('touchmove', (e) => { e.preventDefault(); updateStick(e); });
        area.addEventListener('touchend', (e) => { e.preventDefault(); resetStick(); });
    }

    // --- 우측 조이스틱 (R3: Byte 7/8 - 1붐, 회전) ---
    function setupRightJoystick() {
        const area = document.getElementById('areaRight');
        const stick = document.getElementById('stickRight');
        const maxRadius = 24;

        function updateStick(e) {
            const touch = e.touches[0];
            const rect = area.getBoundingClientRect();
            const deltaX = touch.clientX - (rect.left + rect.width / 2);
            const deltaY = touch.clientY - (rect.top + rect.height / 2);
            const dist = Math.hypot(deltaX, deltaY);

            let normX = deltaX / maxRadius;
            let normY = deltaY / maxRadius;
            if (dist > maxRadius) {
                normX /= (dist / maxRadius);
                normY /= (dist / maxRadius);
            }

            stick.style.transform = `translate(${normX * maxRadius}px, ${normY * maxRadius}px)`;

            const valX = Math.round((normX + 1) * 127.5); // 회전
            const valY = Math.round((normY + 1) * 127.5); // 1붐

            packet[7] = valX; // Byte 8 (TPDO2 Byte 8)
            packet[6] = valY; // Byte 7 (TPDO2 Byte 7)

            // 1붐 상/하 (Byte 1: Bit 2=하강(0x04), Byte 2: Bit 2=상승(0x04))
            if (valY > 175) { packet[0] |= 0x04; packet[1] &= ~0x04; }
            else if (valY < 80) { packet[1] |= 0x04; packet[0] &= ~0x04; }
            else { packet[0] &= ~0x04; packet[1] &= ~0x04; }

            // 좌/우 회전 (Byte 1: Bit 3=우회전(0x08), Byte 2: Bit 3=좌회전(0x08))
            if (valX > 175) { packet[0] |= 0x08; packet[1] &= ~0x08; }
            else if (valX < 80) { packet[1] |= 0x08; packet[0] &= ~0x08; }
            else { packet[0] &= ~0x08; packet[1] &= ~0x08; }
        }

        function resetStick() {
            stick.style.transform = `translate(0px, 0px)`;
            packet[6] = 128; // Byte 7
            packet[7] = 128; // Byte 8
            packet[0] &= ~0x0C; // Byte 1 비트 해제
            packet[1] &= ~0x0C; // Byte 2 비트 해제
        }

        area.addEventListener('touchstart', (e) => { e.preventDefault(); updateStick(e); });
        area.addEventListener('touchmove', (e) => { e.preventDefault(); updateStick(e); });
        area.addEventListener('touchend', (e) => { e.preventDefault(); resetStick(); });
    }

    setupLeftJoystick();
    setupRightJoystick();

    // --- 슬라이더 (L2: Byte 9, R2: Byte 10) ---
    function setupSlider(sliderId, labelId, title, packetIdx, bitUpShift, bitDownShift) {
        const slider = document.getElementById(sliderId);
        const label = document.getElementById(labelId);

        function onInput() {
            const val = parseInt(slider.value);
            label.innerText = `${title}: ${val}`;
            packet[packetIdx] = val;

            // Byte 1 / Byte 2 비트 제어
            if (val > 175) { packet[0] |= (1 << bitUpShift); packet[1] &= ~(1 << bitUpShift); }
            else if (val < 80) { packet[1] |= (1 << bitDownShift); packet[0] &= ~(1 << bitDownShift); }
            else { 
                packet[0] &= ~(1 << bitUpShift); 
                packet[1] &= ~(1 << bitDownShift); 
            }
        }

        function reset() {
            slider.value = 128;
            label.innerText = `${title}: 128`;
            packet[packetIdx] = 128;
            packet[0] &= ~(1 << bitUpShift);
            packet[1] &= ~(1 << bitDownShift);
        }

        slider.addEventListener('input', onInput);
        slider.addEventListener('touchend', reset);
        slider.addEventListener('mouseup', reset);
    }

    setupSlider('sliderA5', 'lblA5', '3붐 제어 (L2)', 8, 4, 4); // Byte 9, Byte 1/2 Bit 4
    setupSlider('sliderA6', 'lblA6', '2붐 제어 (R2)', 9, 5, 5); // Byte 10, Byte 1/2 Bit 5

    // --- 토출량 노브 (A8 -> Byte 12 = packet[11]) ---
    const knobA8 = document.getElementById('knobA8');
    const ptrA8 = document.getElementById('ptrA8');
    const valA8 = document.getElementById('valA8');
    let startY = 0, startVal = 128;

    knobA8.addEventListener('touchstart', (e) => {
        e.preventDefault();
        startY = e.touches[0].clientY;
        startVal = packet[11];
    });

    knobA8.addEventListener('touchmove', (e) => {
        e.preventDefault();
        let deltaY = startY - e.touches[0].clientY;
        let newVal = Math.min(255, Math.max(0, startVal + Math.round(deltaY * 1.5)));
        
        packet[11] = newVal; // Byte 12
        valA8.innerText = newVal;
        ptrA8.style.transform = `rotate(${-135 + (newVal / 255) * 270}deg)`;
    });

    // --- 순간작동 버튼 바인딩 함수 ---
    function bindMomentary(btnId, packetIdx, bitShift) {
        const btn = document.getElementById(btnId);
        btn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            btn.classList.add('active');
            packet[packetIdx] |= (1 << bitShift);
        });
        btn.addEventListener('touchend', (e) => {
            e.preventDefault();
            btn.classList.remove('active');
            packet[packetIdx] &= ~(1 << bitShift);
        });
    }

    // Byte 4 (packet[3]): Air Cuff (Bit 0 = 0x01)
    bindMomentary('btnStartD1', 3, 0);

    // Byte 3 (packet[2]): Motion Control (Bit 7 = 0x80)
    bindMomentary('btnMotionD8', 2, 7);

    // Byte 3 (packet[2]): 악셀 상승/하강 (Bit 1 = 0x02, Bit 2 = 0x04)
    bindMomentary('btnRpmPlus', 2, 1);
    bindMomentary('btnRpmMinus', 2, 2);

    // Byte 3 (packet[2]): HORN (Bit 5 = 0x20), 행정변환 (Bit 6 = 0x40)
    bindMomentary('btnHorn', 2, 5);
    bindMomentary('btnStroke', 2, 6);

    // Byte 4 (packet[3]): E/H Open (Bit 6 = 0x40), E/H Close (Bit 7 = 0x80)
    bindMomentary('btnHoseOpen', 3, 6);
    bindMomentary('btnHoseClose', 3, 7);

    // --- BOOM / OUT (아우트리거) 모드 선택 (Byte 4 = packet[3]) ---
    const btnBoom = document.getElementById('btnBoom');
    const btnOut = document.getElementById('btnOut');

    btnBoom.addEventListener('touchstart', (e) => {
        e.preventDefault();
        btnBoom.classList.add('active');
        btnOut.classList.remove('active');
        packet[3] |= 0x02;  // Byte 4, Bit 1 (0x02) = 붐
        packet[3] &= ~0x20; // Byte 4, Bit 5 (0x20) = 아우트리거 해제
    });

    btnOut.addEventListener('touchstart', (e) => {
        e.preventDefault();
        btnOut.classList.add('active');
        btnBoom.classList.remove('active');
        packet[3] |= 0x20;  // Byte 4, Bit 5 (0x20) = 아우트리거
        packet[3] &= ~0x02; // Byte 4, Bit 1 (0x02) = 붐 해제
    });

    // --- PUMP 정전/역전 선택 (Byte 3 = packet[2]) ---
    const btnPumpFwd = document.getElementById('btnPumpFwd');
    const btnPumpRev = document.getElementById('btnPumpRev');

    btnPumpFwd.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (btnPumpFwd.classList.contains('active')) {
            btnPumpFwd.classList.remove('active');
            packet[2] &= ~0x08; // 펌핑 정전 해제
        } else {
            btnPumpFwd.classList.add('active');
            btnPumpRev.classList.remove('active');
            packet[2] |= 0x08;  // Byte 3, Bit 3 (0x08) = 펌핑 정전
            packet[2] &= ~0x10; // Byte 3, Bit 4 (0x10) = 펌핑 역전 해제
        }
    });

    btnPumpRev.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (btnPumpRev.classList.contains('active')) {
            btnPumpRev.classList.remove('active');
            packet[2] &= ~0x10; // 펌핑 역전 해제
        } else {
            btnPumpRev.classList.add('active');
            btnPumpFwd.classList.remove('active');
            packet[2] |= 0x10;  // Byte 3, Bit 4 (0x10) = 펌핑 역전
            packet[2] &= ~0x08; // Byte 3, Bit 3 (0x08) = 펌핑 정전 해제
        }
    });
</script>

</body>
</html>
