<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DY Concrete Pump Controller</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: none; /* 전체화면 고정 및 스크롤 완전 방지 */
        }

        html, body {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            position: fixed;
            top: 0;
            left: 0;
            overflow: hidden;
            background-color: #121214;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            padding: 8px 12px;
            box-sizing: border-box;
            justify-content: space-between;
        }

        /* 상단 헤더 */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 36px;
            background: #1e1e22;
            border-radius: 8px;
            padding: 0 16px;
        }

        .status-text { font-weight: bold; font-size: 13px; color: #ff453a; }
        .status-text.connected { color: #30d158; }

        .btn-connect {
            background-color: #0a84ff;
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
        }

        /* 메인 조이스틱 섹션 */
        .joystick-section {
            display: flex;
            gap: 12px;
            flex: 1.2;
            margin: 6px 0;
        }

        .joystick-card {
            flex: 1;
            background: #1c1c20;
            border: 1px solid #2c2c32;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            padding: 6px;
        }

        .card-title { font-size: 12px; color: #0a84ff; font-weight: bold; }

        .stick-area {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: #282830;
            border: 2px solid #3a3a45;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stick-handle {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: radial-gradient(circle, #e5e5ea 0%, #8e8e93 100%);
            border: 2px solid #ffffff;
            position: absolute;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            left: 34px;
            top: 34px;
        }

        .slider-box {
            width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .slider-label { font-size: 11px; color: #ffd60a; margin-bottom: 2px; }
        .custom-slider { width: 100%; accent-color: #ffd60a; }

        /* 하단 제어 패널 */
        .control-panel {
            flex: 1;
            background: #1c1c20;
            border: 1px solid #2c2c32;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 4px;
        }

        .group-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .group-title { font-size: 10px; color: #8e8e93; }

        .btn-ctrl {
            width: 48px;
            height: 30px;
            background: #2c2c32;
            color: #fff;
            border: 1px solid #44444e;
            border-radius: 6px;
            font-size: 10px;
            font-weight: bold;
        }
        .btn-ctrl:active, .btn-ctrl.active { background: #0a84ff; border-color: #0a84ff; }

        .btn-gss {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: radial-gradient(circle, #ff453a 0%, #ff3b30 100%);
            color: white;
            font-weight: bold;
            font-size: 14px;
            border: 3px solid #ffffff;
            box-shadow: 0 0 12px rgba(255, 69, 58, 0.6);
        }
        .btn-gss:active { transform: scale(0.95); }

        .knob-container {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 3px solid #ffd60a;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .knob-pointer {
            width: 3px;
            height: 16px;
            background: #ffd60a;
            position: absolute;
            top: 2px;
            border-radius: 2px;
            transform-origin: bottom center;
        }
        .knob-val { font-size: 10px; color: #ffd60a; font-weight: bold; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header-bar">
        <div id="status" class="status-text">BLE 미연결</div>
        <button class="btn-connect" onclick="connectBLE()">ESP32 연결하기</button>
    </div>

    <div class="joystick-section">
        <!-- 좌측 조이스틱 -->
        <div class="joystick-card">
            <div class="card-title">좌측 조이스틱 (4붐/5붐)</div>
            <div class="stick-area" id="areaLeft">
                <div class="stick-handle" id="stickLeft"></div>
            </div>
            <div class="slider-box">
                <div class="slider-label" id="lblA5">3붐 회전 (A5): 128</div>
                <input type="range" id="sliderA5" class="custom-slider" min="0" max="255" value="128">
            </div>
        </div>

        <!-- 우측 조이스틱 -->
        <div class="joystick-card">
            <div class="card-title">우측 조이스틱 (스윙/1붐)</div>
            <div class="stick-area" id="areaRight">
                <div class="stick-handle" id="stickRight"></div>
            </div>
            <div class="slider-box">
                <div class="slider-label" id="lblA6">2붐 회전 (A6): 128</div>
                <input type="range" id="sliderA6" class="custom-slider" min="0" max="255" value="128">
            </div>
        </div>
    </div>

    <!-- 하단 제어 패널 -->
    <div class="control-panel">
        <div class="group-box">
            <div class="group-title">BOOM/OUT</div>
            <button class="btn-ctrl" id="btnBoom">BOOM</button>
            <button class="btn-ctrl" id="btnOut">OUT</button>
        </div>

        <div class="group-box">
            <div class="group-title">RPM</div>
            <button class="btn-ctrl" id="btnRpmPlus">+ RPM</button>
            <button class="btn-ctrl" id="btnRpmMinus">- RPM</button>
        </div>

        <div class="group-box">
            <div class="group-title">토출량(A8)</div>
            <div class="knob-container" id="knobA8"><div class="knob-pointer" id="ptrA8"></div></div>
            <div class="knob-val" id="valA8">128</div>
        </div>

        <button class="btn-gss" id="btnGSS">GSS</button>

        <div class="group-box">
            <div class="group-title">HORN/JUMP</div>
            <button class="btn-ctrl" id="btnHorn">HORN</button>
            <button class="btn-ctrl" id="btnJump">JUMP</button>
        </div>

        <div class="group-box">
            <div class="group-title">PUMP</div>
            <button class="btn-ctrl" id="btnPumpFwd">정전</button>
            <button class="btn-ctrl" id="btnPumpRev">역전</button>
        </div>

        <div class="group-box">
            <div class="group-title">BOOM SPD</div>
            <div class="knob-container" id="knobSpd"><div class="knob-pointer" id="ptrSpd"></div></div>
            <div class="knob-val" id="valSpd">128</div>
        </div>

        <div class="group-box">
            <div class="group-title">END HOSE</div>
            <button class="btn-ctrl" id="btnHoseOpen">OPEN</button>
            <button class="btn-ctrl" id="btnHoseClose">CLOSE</button>
        </div>
    </div>
</div>

<script>
    const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
    const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

    let bleDevice = null;
    let gattCharacteristic = null;

    // 12바이트 TPDO 데이터 패킷
    let packet = new Uint8Array(12);
    packet.fill(128, 4, 12); // 아날로그 축 기본값 128 (중립)
    packet[0] = 0; packet[1] = 0; packet[2] = 0; packet[3] = 0;

    async function connectBLE() {
        try {
            const statusDiv = document.getElementById("status");
            statusDiv.innerText = "검색 중...";

            bleDevice = await navigator.bluetooth.requestDevice({
                acceptAllDevices: true,
                optionalServices: [SERVICE_UUID]
            });

            statusDiv.innerText = "연결 중...";
            const server = await bleDevice.gatt.connect();
            const service = await server.getPrimaryService(SERVICE_UUID);
            gattCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

            statusDiv.innerText = "WROVER 연결됨";
            statusDiv.className = "status-text connected";

            bleDevice.addEventListener('gattserverdisconnected', () => {
                statusDiv.innerText = "BLE 연결 끊김";
                statusDiv.className = "status-text";
            });
        } catch (error) {
            alert("BLE 연결 실패: " + error);
        }
    }

    async function sendPacket() {
        if (!gattCharacteristic) return;
        try {
            await gattCharacteristic.writeValueWithoutResponse(packet);
        } catch (e) {
            console.error(e);
        }
    }

    // --- 조이스틱 터치 드래그 연산 ---
    function setupJoystick(areaId, stickId, axisXIndex, axisYIndex) {
        const area = document.getElementById(areaId);
        const stick = document.getElementById(stickId);
        const maxRadius = 35;

        function updateStick(clientX, clientY) {
            const rect = area.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            let deltaX = clientX - centerX;
            let deltaY = clientY - centerY;
            let distance = Math.hypot(deltaX, deltaY);

            if (distance > maxRadius) {
                deltaX = (deltaX / distance) * maxRadius;
                deltaY = (deltaY / distance) * maxRadius;
            }

            stick.style.transform = `translate(${deltaX}px, ${deltaY}px)`;

            // 0 ~ 255 정규화
            packet[axisXIndex] = Math.round(((deltaX / maxRadius) + 1) * 127.5);
            packet[axisYIndex] = Math.round(((deltaY / maxRadius) + 1) * 127.5);
            sendPacket();
        }

        function resetStick() {
            stick.style.transform = `translate(0px, 0px)`;
            packet[axisXIndex] = 128;
            packet[axisYIndex] = 128;
            sendPacket();
        }

        area.addEventListener('touchstart', (e) => updateStick(e.touches[0].clientX, e.touches[0].clientY));
        area.addEventListener('touchmove', (e) => updateStick(e.touches[0].clientX, e.touches[0].clientY));
        area.addEventListener('touchend', resetStick);
    }

    setupJoystick('areaLeft', 'stickLeft', 5, 4);   // 4붐/5붐 (Left Stick)
    setupJoystick('areaRight', 'stickRight', 7, 6); // 스윙/1붐 (Right Stick)

    // --- 슬라이더 2붐 / 3붐 자동 중립 복귀 (Auto Return) ---
    function setupAutoReturnSlider(sliderId, labelId, labelPrefix, packetIndex) {
        const slider = document.getElementById(sliderId);
        const label = document.getElementById(labelId);

        function onInput() {
            const val = parseInt(slider.value);
            label.innerText = `${labelPrefix}: ${val}`;
            packet[packetIndex] = val;
            sendPacket();
        }

        function resetSlider() {
            slider.value = 128;
            label.innerText = `${labelPrefix}: 128`;
            packet[packetIndex] = 128;
            sendPacket();
        }

        slider.addEventListener('input', onInput);
        slider.addEventListener('touchend', resetSlider);
        slider.addEventListener('mouseup', resetSlider);
    }

    setupAutoReturnSlider('sliderA5', 'lblA5', '3붐 회전 (A5)', 8); // L2 위치 매핑
    setupAutoReturnSlider('sliderA6', 'lblA6', '2붐 회전 (A6)', 9); // R2 위치 매핑

    // --- 버튼 이벤트 핸들러 ---
    function bindButton(btnId, bitByte, bitShift) {
        const btn = document.getElementById(btnId);
        
        btn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            btn.classList.add('active');
            packet[bitByte] |= (1 << bitShift);
            sendPacket();
        });

        btn.addEventListener('touchend', (e) => {
            e.preventDefault();
            btn.classList.remove('active');
            packet[bitByte] &= ~(1 << bitShift);
            sendPacket();
        });
    }

    bindButton('btnGSS', 2, 5);      // CROSS (GSS Emergency)
    bindButton('btnPumpFwd', 2, 1);  // 정전
    bindButton('btnPumpRev', 2, 2);  // 역전
    bindButton('btnHorn', 3, 1);     // HORN
    bindButton('btnJump', 3, 5);     // JUMP
</script>

</body>
</html>
