<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DY Concrete Pump Controller</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        /* 
         세로모드에서도 가로모드와 동일한 구성을 유지하도록 
         최소 너비(850px)를 강제하여 레이아웃 붕괴를 막습니다. 
        */
        html, body {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow-x: auto;
            overflow-y: hidden;
            touch-action: pan-x pan-y; /* 스크롤은 허용하되 컨트롤러 조작 방해 금지 */
        }

        .app-root {
            display: flex;
            width: max(100vw, 850px);
            height: 100%;
            padding: 10px;
            gap: 10px;
        }

        /* 좌우 대칭 세로 버튼 패널 */
        .side-panel {
            width: 50px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            flex-shrink: 0;
        }

        .btn-vertical {
            height: 120px;
            width: 100%;
            border-radius: 8px;
            writing-mode: vertical-rl;
            text-orientation: upright;
            font-weight: 900;
            font-size: 14px;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            touch-action: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }

        .btn-start { background: #30d158; color: #000; border: 2px solid #248a3d; }
        .btn-start.active { background: #248a3d; transform: scale(0.95); }

        .btn-motion { background: #ffd60a; color: #000; border: 2px solid #ccaa00; }
        .btn-motion.active { background: #ccaa00; transform: scale(0.95); }

        /* 메인 패널 */
        .main-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* 상단 헤더 */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 35px;
            background: #252525;
            border-radius: 6px;
            padding: 0 15px;
        }
        .status-text { font-weight: bold; font-size: 14px; color: #ff453a; }
        .status-text.connected { color: #30d158; }
        .btn-connect {
            background-color: #0a84ff;
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        /* 조이스틱 영역 */
        .joystick-section {
            display: flex;
            gap: 10px;
            flex: 1;
        }

        .joystick-card {
            flex: 1;
            background: #222;
            border: 1px solid #333;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
        }

        .card-title { font-size: 13px; color: #64d2ff; font-weight: bold; }
        
        .stick-area {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #111;
            border: 2px solid #444;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
        }

        .stick-handle {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: radial-gradient(circle, #ddd 0%, #888 100%);
            border: 2px solid #fff;
            position: absolute;
            pointer-events: none;
        }

        .slider-box { width: 90%; text-align: center; }
        .slider-label { font-size: 12px; color: #ffd60a; margin-bottom: 5px; font-weight: bold; }
        .custom-slider { width: 100%; height: 6px; accent-color: #ffd60a; }

        /* 하단 컨트롤 패널 */
        .bottom-controls {
            height: 120px;
            background: #222;
            border: 1px solid #333;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 15px;
            gap: 5px;
        }

        .ctrl-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .group-label { font-size: 10px; color: #aaa; font-weight: bold; text-transform: uppercase; }

        .btn-grid {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .btn-ctrl {
            width: 55px;
            height: 35px;
            background: #333;
            color: #ddd;
            border: 1px solid #555;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            touch-action: none;
        }
        .btn-ctrl:disabled { opacity: 0.3; }
        .btn-ctrl.active {
            background: #0a84ff;
            color: #fff;
            border-color: #64d2ff;
        }

        /* 회전 노브 UI */
        .knob-wrapper { display: flex; flex-direction: column; align-items: center; gap: 4px; touch-action: none; }
        .knob-container {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 3px solid #ffd60a;
            position: relative;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .knob-pointer {
            width: 3px;
            height: 20px;
            background: #ffd60a;
            position: absolute;
            top: 3px;
            border-radius: 2px;
            transform-origin: bottom center;
            transform: rotate(-135deg);
        }
        .knob-val { font-size: 12px; color: #ffd60a; font-weight: bold; }

        /* GSS 대형 버튼 */
        .btn-gss {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #ff453a;
            color: white;
            border: 4px solid #fff;
            font-size: 18px;
            font-weight: 900;
            box-shadow: 0 0 15px rgba(255, 69, 58, 0.6);
            touch-action: none;
            cursor: pointer;
        }
        .btn-gss.active { transform: scale(0.92); background: #cc2211; }
    </style>
</head>
<body>

<div class="app-root">
    <!-- 1. 좌측 하단 START 패널 -->
    <div class="side-panel">
        <div class="btn-vertical btn-start" id="btnStartD1">START</div>
    </div>

    <div class="main-panel">
        <!-- 상단 상태바 -->
        <div class="header-bar">
            <div id="status" class="status-text">BLE 미연결</div>
            <button class="btn-connect" onclick="connectBLE()">ESP32 연결하기</button>
        </div>

        <!-- 조이스틱 영역 -->
        <div class="joystick-section">
            <div class="joystick-card">
                <div class="card-title">좌측 조이스틱 (4붐/5붐)</div>
                <div class="stick-area" id="areaLeft"><div class="stick-handle" id="stickLeft"></div></div>
                <div class="slider-box">
                    <div class="slider-label" id="lblA5">3붐 회전 (A5): 128</div>
                    <input type="range" id="sliderA5" class="custom-slider" min="0" max="255" value="128">
                </div>
            </div>

            <div class="joystick-card">
                <div class="card-title">우측 조이스틱 (스윙/1붐)</div>
                <div class="stick-area" id="areaRight"><div class="stick-handle" id="stickRight"></div></div>
                <div class="slider-box">
                    <div class="slider-label" id="lblA6">2붐 회전 (A6): 128</div>
                    <input type="range" id="sliderA6" class="custom-slider" min="0" max="255" value="128">
                </div>
            </div>
        </div>

        <!-- 하단 컨트롤 영역 (이미지와 동일한 배치) -->
        <div class="bottom-controls">
            <div class="ctrl-group">
                <div class="group-label">BOOM/OUT</div>
                <div class="btn-grid">
                    <button class="btn-ctrl active" id="btnBoom">BOOM</button>
                    <button class="btn-ctrl" id="btnOut">OUT</button>
                </div>
            </div>

            <div class="ctrl-group">
                <div class="group-label">N/A</div>
                <div class="btn-grid">
                    <button class="btn-ctrl" disabled>D9</button>
                    <button class="btn-ctrl" disabled>D12</button>
                </div>
            </div>

            <div class="ctrl-group">
                <div class="group-label">RPM</div>
                <div class="btn-grid">
                    <button class="btn-ctrl" id="btnRpmPlus">+ RPM</button>
                    <button class="btn-ctrl" id="btnRpmMinus">- RPM</button>
                </div>
            </div>

            <div class="knob-wrapper">
                <div class="group-label">토출량(A8)</div>
                <div class="knob-container" id="knobA8"><div class="knob-pointer" id="ptrA8"></div></div>
                <div class="knob-val" id="valA8">128</div>
            </div>

            <div class="ctrl-group" style="justify-content: center;">
                <button class="btn-gss" id="btnGSS">GSS</button>
            </div>

            <div class="ctrl-group">
                <div class="group-label">HORN/JUMP</div>
                <div class="btn-grid">
                    <button class="btn-ctrl" id="btnHorn">HORN</button>
                    <button class="btn-ctrl" id="btnJump">JUMP</button>
                </div>
            </div>

            <div class="ctrl-group">
                <div class="group-label">PUMP</div>
                <div class="btn-grid">
                    <button class="btn-ctrl" id="btnPumpFwd">정전</button>
                    <button class="btn-ctrl" id="btnPumpRev">역전</button>
                </div>
            </div>

            <div class="knob-wrapper">
                <div class="group-label">BOOM SPD</div>
                <div class="knob-container" id="knobA7"><div class="knob-pointer" id="ptrA7"></div></div>
                <div class="knob-val" id="valA7">128</div>
            </div>

            <div class="ctrl-group">
                <div class="group-label">END HOSE</div>
                <div class="btn-grid">
                    <button class="btn-ctrl" id="btnHoseOpen">OPEN</button>
                    <button class="btn-ctrl" id="btnHoseClose">CLOSE</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 2. 우측 하단 MOTION 패널 -->
    <div class="side-panel">
        <div class="btn-vertical btn-motion" id="btnMotionD8">MOTION</div>
    </div>
</div>

<script>
    const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
    const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

    let bleDevice = null;
    let gattCharacteristic = null;
    let isConnected = false;
    let isSending = false;
    let sendInterval = null; // 원복된 타이머

    const encoder = new TextEncoder();
    let packet = new Uint8Array(12);
    packet[0] = 0x00;
    packet[1] = 0x00;
    packet[2] = 0x00;
    packet[3] = 0x02; // BOOM 기본
    packet.fill(128, 4, 12); // 조이스틱/아날로그 중립

    // 터치 이벤트 유틸 (레이아웃 틀어짐 방지)
    function attachTouch(el, start, move, end) {
        el.addEventListener('touchstart', (e) => { e.preventDefault(); if(start) start(e); }, {passive:false});
        el.addEventListener('touchmove', (e) => { e.preventDefault(); if(move) move(e); }, {passive:false});
        el.addEventListener('touchend', (e) => { e.preventDefault(); if(end) end(e); }, {passive:false});
        el.addEventListener('touchcancel', (e) => { e.preventDefault(); if(end) end(e); }, {passive:false});
    }

    // 4. 잘되던 시절의 setInterval 블루투스 80ms 통신 롤백
    async function connectBLE() {
        try {
            const statusDiv = document.getElementById("status");
            statusDiv.innerText = "검색 중...";

            bleDevice = await navigator.bluetooth.requestDevice({
                acceptAllDevices: true,
                optionalServices: [SERVICE_UUID]
            });

            const server = await bleDevice.gatt.connect();
            const service = await server.getPrimaryService(SERVICE_UUID);
            gattCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

            isConnected = true;
            statusDiv.innerText = "연결됨 (80ms)";
            statusDiv.className = "status-text connected";

            // 기존에 잘 작동하던 setInterval 방식으로 복원
            if(sendInterval) clearInterval(sendInterval);
            sendInterval = setInterval(sendBLEData, 80);

            bleDevice.addEventListener('gattserverdisconnected', () => {
                isConnected = false;
                clearInterval(sendInterval);
                statusDiv.innerText = "BLE 연결 끊김";
                statusDiv.className = "status-text";
            });
        } catch (error) {
            alert("BLE 연결 실패: " + error);
        }
    }

    async function sendBLEData() {
        if (!isConnected || !gattCharacteristic || isSending) return;
        isSending = true;

        try {
            let hexStr = "";
            for (let i = 0; i < packet.length; i++) {
                hexStr += packet[i].toString(16).padStart(2, '0').toUpperCase() + (i===packet.length-1?"":" ");
            }
            hexStr += "\n";
            
            const dataBuffer = encoder.encode(hexStr);
            await gattCharacteristic.writeValueWithoutResponse(dataBuffer);
        } catch (e) {
            console.error("BLE 발송 에러:", e);
        } finally {
            isSending = false;
        }
    }

    // --- 조이스틱 제어 ---
    function setupJoystick(areaId, stickId, xIdx, yIdx, upBit, downBit, leftBit, rightBit, byte0Idx, byte1Idx) {
        const area = document.getElementById(areaId);
        const stick = document.getElementById(stickId);
        const maxRadius = 35;

        function update(e) {
            const rect = area.getBoundingClientRect();
            const touch = e.touches[0];
            const dx = touch.clientX - (rect.left + rect.width/2);
            const dy = touch.clientY - (rect.top + rect.height/2);
            const dist = Math.hypot(dx, dy);

            let nx = dx/maxRadius, ny = dy/maxRadius;
            if(dist > maxRadius) { nx /= (dist/maxRadius); ny /= (dist/maxRadius); }
            
            stick.style.transform = `translate(${nx * maxRadius}px, ${ny * maxRadius}px)`;

            const vx = Math.round((nx + 1) * 127.5);
            const vy = Math.round((ny + 1) * 127.5);
            packet[xIdx] = vx; packet[yIdx] = vy;

            // 상하 스위치 비트
            if(vy < 80) { packet[byte0Idx] |= upBit; packet[byte1Idx] &= ~upBit; }
            else if(vy > 175) { packet[byte1Idx] |= upBit; packet[byte0Idx] &= ~upBit; }
            else { packet[byte0Idx] &= ~upBit; packet[byte1Idx] &= ~upBit; }

            // 좌우 스위치 비트
            if(vx > 175) { packet[byte0Idx] |= leftBit; packet[byte1Idx] &= ~leftBit; }
            else if(vx < 80) { packet[byte1Idx] |= leftBit; packet[byte0Idx] &= ~leftBit; }
            else { packet[byte0Idx] &= ~leftBit; packet[byte1Idx] &= ~leftBit; }
        }

        function reset() {
            stick.style.transform = 'translate(0px,0px)';
            packet[xIdx] = 128; packet[yIdx] = 128;
            packet[byte0Idx] &= ~(upBit | leftBit);
            packet[byte1Idx] &= ~(upBit | leftBit);
        }
        attachTouch(area, update, update, reset);
    }

    setupJoystick('areaLeft', 'stickLeft', 5, 4, 0x01, 0x01, 0x02, 0x02, 0, 1);
    setupJoystick('areaRight', 'stickRight', 7, 6, 0x04, 0x04, 0x08, 0x08, 0, 1);

    // --- 가로 슬라이더 ---
    function setupSlider(id, lblId, title, idx) {
        const el = document.getElementById(id);
        const lbl = document.getElementById(lblId);
        el.addEventListener('input', () => {
            packet[idx] = parseInt(el.value);
            lbl.innerText = `${title}: ${el.value}`;
        });
        el.addEventListener('touchend', () => {
            el.value = 128; packet[idx] = 128; lbl.innerText = `${title}: 128`;
        });
    }
    setupSlider('sliderA5', 'lblA5', '3붐 회전 (A5)', 8);
    setupSlider('sliderA6', 'lblA6', '2붐 회전 (A6)', 9);

    // --- 회전 노브 (토출량, BOOM SPD) ---
    function setupKnob(knobId, ptrId, valId, packetIdx) {
        const knob = document.getElementById(knobId);
        const ptr = document.getElementById(ptrId);
        const valDisp = document.getElementById(valId);
        let startY = 0, startVal = 128;

        attachTouch(knob,
            (e) => { startY = e.touches[0].clientY; startVal = packet[packetIdx]; },
            (e) => {
                let dy = startY - e.touches[0].clientY;
                let newVal = Math.min(255, Math.max(0, startVal + Math.round(dy * 1.5)));
                packet[packetIdx] = newVal;
                valDisp.innerText = newVal;
                ptr.style.transform = `rotate(${-135 + (newVal / 255) * 270}deg)`;
            },
            null
        );
    }
    setupKnob('knobA8', 'ptrA8', 'valA8', 11);
    setupKnob('knobA7', 'ptrA7', 'valA7', 10);

    // --- 단순 누름(Momentary) 버튼 ---
    function bindMom(id, byteIdx, bitMask) {
        const btn = document.getElementById(id);
        attachTouch(btn,
            () => { btn.classList.add('active'); packet[byteIdx] |= bitMask; },
            null,
            () => { btn.classList.remove('active'); packet[byteIdx] &= ~bitMask; }
        );
    }
    bindMom('btnStartD1', 3, 0x01);
    bindMom('btnMotionD8', 2, 0x80);
    bindMom('btnRpmPlus', 2, 0x02);
    bindMom('btnRpmMinus', 2, 0x04);
    bindMom('btnGSS', 3, 0x10); // GSS 비상정지
    bindMom('btnHorn', 2, 0x20);
    bindMom('btnJump', 2, 0x40);
    bindMom('btnHoseOpen', 3, 0x40);
    bindMom('btnHoseClose', 3, 0x80);

    // --- BOOM / OUT 토글 ---
    const btnBoom = document.getElementById('btnBoom');
    const btnOut = document.getElementById('btnOut');
    attachTouch(btnBoom, () => {
        btnBoom.classList.add('active'); btnOut.classList.remove('active');
        packet[3] = (packet[3] & ~0x20) | 0x02;
    });
    attachTouch(btnOut, () => {
        btnOut.classList.add('active'); btnBoom.classList.remove('active');
        packet[3] = (packet[3] & ~0x02) | 0x20;
    });

    // --- PUMP 정전 / 역전 토글 ---
    const btnPumpFwd = document.getElementById('btnPumpFwd');
    const btnPumpRev = document.getElementById('btnPumpRev');
    attachTouch(btnPumpFwd, () => {
        if(btnPumpFwd.classList.contains('active')) {
            btnPumpFwd.classList.remove('active'); packet[2] &= ~0x08;
        } else {
            btnPumpFwd.classList.add('active'); btnPumpRev.classList.remove('active');
            packet[2] = (packet[2] & ~0x10) | 0x08;
        }
    });
    attachTouch(btnPumpRev, () => {
        if(btnPumpRev.classList.contains('active')) {
            btnPumpRev.classList.remove('active'); packet[2] &= ~0x10;
        } else {
            btnPumpRev.classList.add('active'); btnPumpFwd.classList.remove('active');
            packet[2] = (packet[2] & ~0x08) | 0x10;
        }
    });
</script>

</body>
</html>
