<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DY Concrete Pump Controller</title>
    <style>
        /* 1. 전체화면 기본 리셋 & 스크롤 방지 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            height: 100dvh; /* iOS 모바일 가상 키보드/주소창 바 대응 */
            overflow: hidden;
            background-color: #121214;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* 2. 메인 컨테이너 (화면 전체 100% 채움) */
        .app-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            padding: 8px 12px;
            box-sizing: border-box;
            justify-content: space-between;
        }

        /* 3. 상단 헤더 바 */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 40px;
            background: #1e1e22;
            border-radius: 8px;
            padding: 0 16px;
            margin-bottom: 8px;
        }

        .status-text {
            font-weight: bold;
            font-size: 14px;
            color: #ff453a;
        }
        .status-text.connected { color: #30d158; }

        .btn-connect {
            background-color: #0a84ff;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
        }

        /* 4. 중단 조이스틱 영역 (화면 절반 높이 차지) */
        .joystick-section {
            display: flex;
            gap: 12px;
            flex: 1.2;
            margin-bottom: 8px;
        }

        .joystick-card {
            flex: 1;
            background: #1c1c20;
            border: 1px solid #2c2c32;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            padding: 8px;
        }

        .card-title {
            font-size: 13px;
            color: #0a84ff;
            font-weight: bold;
        }

        .stick-area {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: #282830;
            border: 2px solid #3a3a45;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stick-handle {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: radial-gradient(circle, #e5e5ea 0%, #8e8e93 100%);
            border: 2px solid #ffffff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }

        .slider-box {
            width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .slider-label {
            font-size: 11px;
            color: #ffd60a;
            margin-bottom: 4px;
        }

        .custom-slider {
            width: 100%;
            accent-color: #ffd60a;
        }

        /* 5. 하단 버튼 및 가변 노브 제어판 */
        .control-panel {
            flex: 1;
            background: #1c1c20;
            border: 1px solid #2c2c32;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 6px;
        }

        .group-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .group-title {
            font-size: 10px;
            color: #8e8e93;
            letter-spacing: 0.5px;
        }

        .btn-ctrl {
            width: 50px;
            height: 32px;
            background: #2c2c32;
            color: #fff;
            border: 1px solid #44444e;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
        }
        .btn-ctrl:active { background: #0a84ff; }

        /* GSS 비상 정지 버튼 레드 하이라이트 */
        .btn-gss {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: radial-gradient(circle, #ff453a 0%, #ff3b30 100%);
            color: white;
            font-weight: bold;
            font-size: 15px;
            border: 3px solid #ffffff;
            box-shadow: 0 0 15px rgba(255, 69, 58, 0.6);
        }

        /* 다이얼 노브 스타일 */
        .knob-container {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 3px solid #ffd60a;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .knob-pointer {
            width: 3px;
            height: 18px;
            background: #ffd60a;
            position: absolute;
            top: 4px;
            border-radius: 2px;
        }
        .knob-val {
            font-size: 11px;
            color: #ffd60a;
            font-weight: bold;
            margin-top: 2px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- 상단 바 -->
    <div class="header-bar">
        <div id="status" class="status-text">BLE 미연결</div>
        <button class="btn-connect" onclick="connectBLE()">ESP32 연결하기</button>
    </div>

    <!-- 중단 조이스틱 영역 -->
    <div class="joystick-section">
        <!-- 좌측 조이스틱 -->
        <div class="joystick-card">
            <div class="card-title">좌측 조이스틱 (4붐/5붐)</div>
            <div class="stick-area">
                <div class="stick-handle"></div>
            </div>
            <div class="slider-box">
                <div class="slider-label">3붐 회전 (A5): 128</div>
                <input type="range" class="custom-slider" min="0" max="255" value="128">
            </div>
        </div>

        <!-- 우측 조이스틱 -->
        <div class="joystick-card">
            <div class="card-title">우측 조이스틱 (스윙/1붐)</div>
            <div class="stick-area">
                <div class="stick-handle"></div>
            </div>
            <div class="slider-box">
                <div class="slider-label">2붐 회전 (A6): 128</div>
                <input type="range" class="custom-slider" min="0" max="255" value="128">
            </div>
        </div>
    </div>

    <!-- 하단 제어 패널 -->
    <div class="control-panel">
        <div class="group-box">
            <div class="group-title">BOOM/OUT</div>
            <button class="btn-ctrl">BOOM</button>
            <button class="btn-ctrl">OUT</button>
        </div>

        <div class="group-box">
            <div class="group-title">RPM</div>
            <button class="btn-ctrl">+ RPM</button>
            <button class="btn-ctrl">- RPM</button>
        </div>

        <div class="group-box">
            <div class="group-title">토출량(A8)</div>
            <div class="knob-container"><div class="knob-pointer"></div></div>
            <div class="knob-val">128</div>
        </div>

        <button class="btn-gss">GSS</button>

        <div class="group-box">
            <div class="group-title">HORN/JUMP</div>
            <button class="btn-ctrl">HORN</button>
            <button class="btn-ctrl">JUMP</button>
        </div>

        <div class="group-box">
            <div class="group-title">PUMP</div>
            <button class="btn-ctrl">정전</button>
            <button class="btn-ctrl">역전</button>
        </div>

        <div class="group-box">
            <div class="group-title">BOOM SPD</div>
            <div class="knob-container"><div class="knob-pointer"></div></div>
            <div class="knob-val">128</div>
        </div>

        <div class="group-box">
            <div class="group-title">END HOSE</div>
            <button class="btn-ctrl">OPEN</button>
            <button class="btn-ctrl">CLOSE</button>
        </div>
    </div>
</div>

<script>
    const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
    const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

    let bleDevice = null;
    let gattCharacteristic = null;

    async function connectBLE() {
        try {
            const statusDiv = document.getElementById("status");
            statusDiv.innerText = "기기 검색 중...";

            bleDevice = await navigator.bluetooth.requestDevice({
                acceptAllDevices: true,
                optionalServices: [SERVICE_UUID]
            });

            statusDiv.innerText = "연결 중...";
            const server = await bleDevice.gatt.connect();
            const service = await server.getPrimaryService(SERVICE_UUID);
            gattCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

            statusDiv.innerText = "WROVER 연결됨";
            statusDiv.className = "status-text connected";

            bleDevice.addEventListener('gattserverdisconnected', () => {
                statusDiv.innerText = "BLE 연결 끊김";
                statusDiv.className = "status-text";
            });
        } catch (error) {
            console.error(error);
            alert("연결 오류: " + error);
        }
    }
</script>

</body>
</html>
