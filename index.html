<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DY Concrete Pump Controller</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: none;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            position: fixed;
            top: 0;
            left: 0;
            overflow: hidden;
            background-color: #121214;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            padding: calc(4px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) calc(4px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
            box-sizing: border-box;
            gap: 6px;
        }

        /* 1. 헤더 바 */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 32px;
            background: #1e1e22;
            border-radius: 6px;
            padding: 0 12px;
            flex-shrink: 0;
        }

        .status-text { font-weight: bold; font-size: 12px; color: #ff453a; }
        .status-text.connected { color: #30d158; }

        .btn-connect {
            background-color: #0a84ff;
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
        }

        /* 2. 조이스틱 영역 */
        .joystick-section {
            display: flex;
            gap: 8px;
            flex: 1.1;
            min-height: 0;
        }

        .joystick-card {
            flex: 1;
            background: #1c1c20;
            border: 1px solid #2c2c32;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly;
            padding: 4px;
        }

        .card-title { font-size: 11px; color: #0a84ff; font-weight: bold; }

        .stick-area {
            width: 86px;
            height: 86px;
            border-radius: 50%;
            background: #282830;
            border: 2px solid #3a3a45;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stick-handle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: radial-gradient(circle, #e5e5ea 0%, #8e8e93 100%);
            border: 2px solid #ffffff;
            position: absolute;
            box-shadow: 0 3px 6px rgba(0,0,0,0.5);
            pointer-events: none;
        }

        .slider-box {
            width: 92%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .slider-label { font-size: 10px; color: #ffd60a; margin-bottom: 2px; }
        .custom-slider { width: 100%; height: 16px; accent-color: #ffd60a; }

        /* 3. 하단 제어 패널 */
        .control-panel {
            flex: 0.9;
            min-height: 0;
            background: #1c1c20;
            border: 1px solid #2c2c32;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 4px 6px;
        }

        .group-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }

        .group-title { font-size: 9px; color: #8e8e93; font-weight: bold; }

        .btn-ctrl {
            width: 44px;
            height: 28px;
            background: #2c2c32;
            color: #ccc;
            border: 1px solid #44444e;
            border-radius: 5px;
            font-size: 10px;
            font-weight: bold;
        }

        .btn-ctrl.active {
            background: #0a84ff;
            color: #ffffff;
            border-color: #64d2ff;
            box-shadow: 0 0 8px rgba(10, 132, 255, 0.6);
        }

        .btn-gss {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: radial-gradient(circle, #ff453a 0%, #ff3b30 100%);
            color: white;
            font-weight: bold;
            font-size: 13px;
            border: 2px solid #ffffff;
            box-shadow: 0 0 10px rgba(255, 69, 58, 0.6);
        }
        .btn-gss.active { transform: scale(0.92); box-shadow: 0 0 18px rgba(255, 69, 58, 1); }

        .knob-container {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid #ffd60a;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: #282830;
            cursor: pointer;
        }
        .knob-pointer {
            width: 2px;
            height: 14px;
            background: #ffd60a;
            position: absolute;
            top: 2px;
            border-radius: 1px;
            transform-origin: bottom center;
            transform: rotate(-135deg);
        }
        .knob-val { font-size: 9px; color: #ffd60a; font-weight: bold; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header-bar">
        <div id="status" class="status-text">BLE 미연결</div>
        <button class="btn-connect" onclick="connectBLE()">ESP32 연결하기</button>
    </div>

    <div class="joystick-section">
        <!-- 좌측 조이스틱 -->
        <div class="joystick-card">
            <div class="card-title">좌측 조이스틱 (4붐/5붐)</div>
            <div class="stick-area" id="areaLeft">
                <div class="stick-handle" id="stickLeft"></div>
            </div>
            <div class="slider-box">
                <div class="slider-label" id="lblA5">3붐 회전 (A5): 128</div>
                <input type="range" id="sliderA5" class="custom-slider" min="0" max="255" value="128">
            </div>
        </div>

        <!-- 우측 조이스틱 -->
        <div class="joystick-card">
            <div class="card-title">우측 조이스틱 (스윙/1붐)</div>
            <div class="stick-area" id="areaRight">
                <div class="stick-handle" id="stickRight"></div>
            </div>
            <div class="slider-box">
                <div class="slider-label" id="lblA6">2붐 회전 (A6): 128</div>
                <input type="range" id="sliderA6" class="custom-slider" min="0" max="255" value="128">
            </div>
        </div>
    </div>

    <div class="control-panel">
        <div class="group-box">
            <div class="group-title">BOOM/OUT</div>
            <button class="btn-ctrl active" id="btnBoom">BOOM</button>
            <button class="btn-ctrl" id="btnOut">OUT</button>
        </div>

        <div class="group-box">
            <div class="group-title">RPM</div>
            <button class="btn-ctrl" id="btnRpmPlus">+ RPM</button>
            <button class="btn-ctrl" id="btnRpmMinus">- RPM</button>
        </div>

        <div class="group-box">
            <div class="group-title">토출량(A8)</div>
            <div class="knob-container" id="knobA8"><div class="knob-pointer" id="ptrA8"></div></div>
            <div class="knob-val" id="valA8">128</div>
        </div>

        <button class="btn-gss" id="btnGSS">GSS</button>

        <div class="group-box">
            <div class="group-title">HORN/JUMP</div>
            <button class="btn-ctrl" id="btnHorn">HORN</button>
            <button class="btn-ctrl" id="btnJump">JUMP</button>
        </div>

        <!-- PUMP (정전 / 역전 / 중립) 토글 -->
        <div class="group-box">
            <div class="group-title">PUMP</div>
            <button class="btn-ctrl" id="btnPumpFwd">정전</button>
            <button class="btn-ctrl" id="btnPumpRev">역전</button>
        </div>

        <div class="group-box">
            <div class="group-title">BOOM SPD</div>
            <div class="knob-container" id="knobSpd"><div class="knob-pointer" id="ptrSpd"></div></div>
            <div class="knob-val" id="valSpd">128</div>
        </div>

        <div class="group-box">
            <div class="group-title">END HOSE</div>
            <button class="btn-ctrl" id="btnHoseOpen">OPEN</button>
            <button class="btn-ctrl" id="btnHoseClose">CLOSE</button>
        </div>
    </div>
</div>

<script>
    const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
    const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

    let bleDevice = null;
    let gattCharacteristic = null;
    let sendIntervalTimer = null;
    let isSending = false;

    // 12바이트 TPDO 데이터 구조
    let packet = new Uint8Array(12);
    packet.fill(128, 4, 12); // 아날로그 축 128 (중립)
    packet[0] = 0; packet[1] = 0; packet[2] = 0; packet[3] = 0;

    async function connectBLE() {
        try {
            const statusDiv = document.getElementById("status");
            statusDiv.innerText = "검색 중...";

            bleDevice = await navigator.bluetooth.requestDevice({
                acceptAllDevices: true,
                optionalServices: [SERVICE_UUID]
            });

            statusDiv.innerText = "연결 중...";
            const server = await bleDevice.gatt.connect();
            const service = await server.getPrimaryService(SERVICE_UUID);
            gattCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

            statusDiv.innerText = "WROVER 연결됨";
            statusDiv.className = "status-text connected";

            // 80ms 주기적 연속 전송 시작
            startSendingLoop();

            bleDevice.addEventListener('gattserverdisconnected', () => {
                statusDiv.innerText = "BLE 연결 끊김";
                statusDiv.className = "status-text";
                stopSendingLoop();
            });
        } catch (error) {
            alert("BLE 연결 실패: " + error);
        }
    }

    // 80ms 타임슬롯 연속 패킷 전송 함수
    function startSendingLoop() {
        if (sendIntervalTimer) clearInterval(sendIntervalTimer);
        sendIntervalTimer = setInterval(async () => {
            if (!gattCharacteristic || isSending) return;
            try {
                isSending = true;
                await gattCharacteristic.writeValueWithoutResponse(packet);
            } catch (e) {
                console.error("전송 에러:", e);
            } finally {
                isSending = false;
            }
        }, 80); // 80ms 주기 전송
    }

    function stopSendingLoop() {
        if (sendIntervalTimer) {
            clearInterval(sendIntervalTimer);
            sendIntervalTimer = null;
        }
    }

    // --- 1. 가로모드 좌표 완전 보정 조이스틱 ---
    function setupJoystick(areaId, stickId, axisXIndex, axisYIndex) {
        const area = document.getElementById(areaId);
        const stick = document.getElementById(stickId);
        const maxRadius = 25;

        function updateStick(e) {
            const touch = e.touches[0];
            const rect = area.getBoundingClientRect(); // 실시간 가로/세로 영역 계산
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            let deltaX = touch.clientX - centerX;
            let deltaY = touch.clientY - centerY;
            let distance = Math.hypot(deltaX, deltaY);

            if (distance > maxRadius) {
                deltaX = (deltaX / distance) * maxRadius;
                deltaY = (deltaY / distance) * maxRadius;
            }

            stick.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
            packet[axisXIndex] = Math.round(((deltaX / maxRadius) + 1) * 127.5);
            packet[axisYIndex] = Math.round(((deltaY / maxRadius) + 1) * 127.5);
        }

        function resetStick() {
            stick.style.transform = `translate(0px, 0px)`;
            packet[axisXIndex] = 128;
            packet[axisYIndex] = 128;
        }

        area.addEventListener('touchstart', (e) => { e.preventDefault(); updateStick(e); });
        area.addEventListener('touchmove', (e) => { e.preventDefault(); updateStick(e); });
        area.addEventListener('touchend', (e) => { e.preventDefault(); resetStick(); });
    }

    setupJoystick('areaLeft', 'stickLeft', 5, 4);   // 4붐/5붐
    setupJoystick('areaRight', 'stickRight', 7, 6); // 스윙/1붐

    // --- 2. 슬라이더 자동 중립 복귀 ---
    function setupAutoReturnSlider(sliderId, labelId, labelPrefix, packetIndex) {
        const slider = document.getElementById(sliderId);
        const label = document.getElementById(labelId);

        function onInput() {
            const val = parseInt(slider.value);
            label.innerText = `${labelPrefix}: ${val}`;
            packet[packetIndex] = val;
        }

        function resetSlider() {
            slider.value = 128;
            label.innerText = `${labelPrefix}: 128`;
            packet[packetIndex] = 128;
        }

        slider.addEventListener('input', onInput);
        slider.addEventListener('touchend', resetSlider);
        slider.addEventListener('mouseup', resetSlider);
    }

    setupAutoReturnSlider('sliderA5', 'lblA5', '3붐 회전 (A5)', 8);
    setupAutoReturnSlider('sliderA6', 'lblA6', '2붐 회전 (A6)', 9);

    // --- 3. 노브 (토출량 & BOOM SPD) ---
    function setupKnob(knobId, ptrId, valId, packetIndex) {
        const knob = document.getElementById(knobId);
        const ptr = document.getElementById(ptrId);
        const valTxt = document.getElementById(valId);
        let startY = 0;
        let startVal = 128;

        knob.addEventListener('touchstart', (e) => {
            e.preventDefault();
            startY = e.touches[0].clientY;
            startVal = packet[packetIndex];
        });

        knob.addEventListener('touchmove', (e) => {
            e.preventDefault();
            let deltaY = startY - e.touches[0].clientY;
            let newVal = Math.min(255, Math.max(0, startVal + Math.round(deltaY * 1.5)));
            
            packet[packetIndex] = newVal;
            valTxt.innerText = newVal;

            let deg = -135 + (newVal / 255) * 270;
            ptr.style.transform = `rotate(${deg}deg)`;
        });
    }

    setupKnob('knobA8', 'ptrA8', 'valA8', 10);
    setupKnob('knobSpd', 'ptrSpd', 'valSpd', 11);

    // --- 4. 버튼 이벤트 (Momentary 및 3단 토클 PUMP) ---
    function bindMomentaryBtn(btnId, bitByte, bitShift) {
        const btn = document.getElementById(btnId);
        btn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            btn.classList.add('active');
            packet[bitByte] |= (1 << bitShift);
        });
        btn.addEventListener('touchend', (e) => {
            e.preventDefault();
            btn.classList.remove('active');
            packet[bitByte] &= ~(1 << bitShift);
        });
    }

    // BOOM / OUT 모드 선택
    const btnBoom = document.getElementById('btnBoom');
    const btnOut = document.getElementById('btnOut');

    btnBoom.addEventListener('touchstart', (e) => {
        e.preventDefault();
        btnBoom.classList.add('active');
        btnOut.classList.remove('active');
        packet[0] &= ~(1 << 0);
    });

    btnOut.addEventListener('touchstart', (e) => {
        e.preventDefault();
        btnOut.classList.add('active');
        btnBoom.classList.remove('active');
        packet[0] |= (1 << 0);
    });

    // PUMP 정전/역전/중립 3단 토글 스위치 (Byte 2)
    const btnPumpFwd = document.getElementById('btnPumpFwd');
    const btnPumpRev = document.getElementById('btnPumpRev');

    btnPumpFwd.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (btnPumpFwd.classList.contains('active')) {
            // 정전 OFF -> 중립
            btnPumpFwd.classList.remove('active');
            packet[2] &= ~(1 << 1);
        } else {
            // 정전 ON
            btnPumpFwd.classList.add('active');
            btnPumpRev.classList.remove('active');
            packet[2] |= (1 << 1);
            packet[2] &= ~(1 << 2);
        }
    });

    btnPumpRev.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (btnPumpRev.classList.contains('active')) {
            // 역전 OFF -> 중립
            btnPumpRev.classList.remove('active');
            packet[2] &= ~(1 << 2);
        } else {
            // 역전 ON
            btnPumpRev.classList.add('active');
            btnPumpFwd.classList.remove('active');
            packet[2] |= (1 << 2);
            packet[2] &= ~(1 << 1);
        }
    });

    // 순간작동 버튼
    bindMomentaryBtn('btnGSS', 2, 5);       // GSS 비상정지
    bindMomentaryBtn('btnRpmPlus', 3, 3);   // RPM +
    bindMomentaryBtn('btnRpmMinus', 3, 4);  // RPM -
    bindMomentaryBtn('btnHorn', 3, 1);      // HORN
    bindMomentaryBtn('btnJump', 3, 5);      // JUMP
    bindMomentaryBtn('btnHoseOpen', 1, 1);  // END HOSE OPEN
    bindMomentaryBtn('btnHoseClose', 1, 2); // END HOSE CLOSE
</script>

</body>
</html>
