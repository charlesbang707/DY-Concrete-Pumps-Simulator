<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ESP32 펌프카 컨트롤러 (3-Joystick)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        
        body, html {
            width: 100vw; height: 100vh;
            background-color: #121212; color: #fff; font-family: sans-serif;
            overflow: hidden; touch-action: none; display: flex; flex-direction: column;
            padding: 5px 25px;
        }

        /* 상단 상태 바 */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            height: 10vh; background-color: #1a1a1a; border-bottom: 1px solid #333;
            border-radius: 8px 8px 0 0; padding: 0 15px; margin-top: 5px;
        }
        .status { color: #ff453a; font-weight: bold; font-size: 1.1rem; }
        .btn-connect { background-color: #007aff; color: white; border: none; padding: 8px 16px; border-radius: 5px; font-weight: bold; cursor: pointer; }

        /* 중앙 조이스틱 영역 */
        .joystick-container {
            display: flex; justify-content: space-between; align-items: stretch;
            height: 48vh; padding: 10px 0; gap: 15px;
        }
        
        .joystick-box {
            flex: 1; background-color: #1e1e1e; border-radius: 10px; border: 1px solid #333;
            display: flex; flex-direction: column; align-items: center; justify-content: space-evenly;
            padding: 5px;
        }
        .joystick-title { color: #aaa; font-size: 0.85rem; font-weight: bold; }
        .joystick-values { color: #ffcc00; font-size: 0.8rem; text-align: center; line-height: 1.2; font-weight: bold; }
        
        /* 조이스틱 */
        .stick-area {
            width: 120px; height: 120px;
            min-width: 120px; min-height: 120px;
            max-width: 120px; max-height: 120px;
            flex: 0 0 120px; aspect-ratio: 1 / 1;
            border-radius: 50%; background-color: #111;
            border: 2px solid #555; position: relative;
            display: flex; justify-content: center; align-items: center;
            touch-action: none; overflow: visible;
        }

        .stick-knob {
            width: 45px; height: 45px;
            min-width: 45px; min-height: 45px;
            border-radius: 50%; background: radial-gradient(circle, #ddd, #888);
            border: 2px solid #fff; position: absolute;
            left: 50%; top: 50%; margin-left: -22.5px; margin-top: -22.5px;
            pointer-events: none; will-change: transform;
        }

        /* 하단 컨트롤 패널 */
        .control-panel {
            display: flex; justify-content: space-between; align-items: center;
            height: 40vh; padding: 10px 15px; background-color: #151515; border-top: 1px solid #333;
            border-radius: 0 0 8px 8px; gap: 8px; margin-bottom: 5px;
        }

        .side-btn { 
            writing-mode: vertical-rl; text-orientation: upright; font-weight: bold; font-size: 14px; letter-spacing: 2px;
            background-color: #34c759; color: #000; border: none; border-radius: 5px; height: 90%; width: 45px; 
            touch-action: none;
        }
        .side-btn.yellow { background-color: #ffcc00; }
        
        .btn-group { display: flex; flex-direction: column; gap: 8px; justify-content: center; }
        .btn { background-color: #333; color: white; border: 1px solid #555; padding: 8px 5px; border-radius: 5px; font-size: 11px; font-weight: bold; min-width: 50px; touch-action: none; }
        .btn.active { background-color: #0a84ff; border-color: #64d2ff; }
        
        .btn-gss {
            background-color: #ff453a; border-radius: 50%; width: 70px; height: 70px; 
            font-size: 18px; font-weight: 900; color: white; border: 4px solid white; box-shadow: 0 0 15px rgba(255,69,58,0.6); touch-action: none;
        }

        .dial-container { display: flex; flex-direction: column; align-items: center; touch-action: none; }
        .dial-title { font-size: 10px; color: #aaa; margin-bottom: 5px; }
        .dial { width: 50px; height: 50px; border-radius: 50%; border: 3px solid #ffcc00; position: relative; background: #111; }
        .dial-ptr { width: 3px; height: 20px; background: #ffcc00; position: absolute; top: 3px; left: 22px; transform-origin: bottom center; transform: rotate(-135deg); }
        .dial-val { color: #ffcc00; margin-top: 5px; font-size: 12px; font-weight:bold; }
    </style>
</head>
<body>

    <div class="header">
        <div class="status" id="statusText">BLE 미연결</div>
        <div id="txText" style="color:#aaa;font-size:12px;margin-left:auto;margin-right:10px;">TX: 0</div>
        <button class="btn-connect" id="connectBtn">ESP32 연결하기</button>
    </div>

    <!-- 조이스틱 3개 영역 -->
    <div class="joystick-container">
        <div class="joystick-box">
            <div class="joystick-title">좌측 (4붐/5붐)</div>
            <div class="stick-area" id="areaLeft"><div class="stick-knob" id="knobLeft"></div></div>
            <div class="joystick-values" id="valLeft">X: 127<br>Y: 127</div>
        </div>
        <div class="joystick-box">
            <div class="joystick-title">중앙 (2붐/3붐)</div>
            <div class="stick-area" id="areaCenter"><div class="stick-knob" id="knobCenter"></div></div>
            <div class="joystick-values" id="valCenter">2붐(A6): 127<br>3붐(A5): 127</div>
        </div>
        <div class="joystick-box">
            <div class="joystick-title">우측 (스윙/1붐)</div>
            <div class="stick-area" id="areaRight"><div class="stick-knob" id="knobRight"></div></div>
            <div class="joystick-values" id="valRight">X: 127<br>Y: 127</div>
        </div>
    </div>

    <!-- 하단 컨트롤 영역 -->
    <div class="control-panel">
        <button class="side-btn" id="btnStart">START</button>
        
        <div class="btn-group">
            <button class="btn" id="btnBoom">BOOM</button>
            <button class="btn" id="btnOut">OUT</button>
        </div>
        <div class="btn-group">
            <button class="btn" disabled>D9</button>
            <button class="btn" disabled>D12</button>
        </div>
        <div class="btn-group">
            <button class="btn" id="btnRpmUp">+ RPM</button>
            <button class="btn" id="btnRpmDn">- RPM</button>
        </div>
        
        <!-- 토출량 -->
        <div class="dial-container" id="dialA8">
            <div class="dial-title">토출량(A8)</div>
            <div class="dial"><div class="dial-ptr" id="ptrA8"></div></div>
            <div class="dial-val" id="valA8">128</div>
        </div>

        <button class="btn-gss" id="btnGSS">GSS</button>

        <div class="btn-group">
            <button class="btn" id="btnHorn">HORN</button>
            <button class="btn" id="btnJump">JUMP</button>
        </div>
        <div class="btn-group">
            <button class="btn" id="btnPumpFwd">정전</button>
            <button class="btn" id="btnPumpRev">역전</button>
        </div>

        <!-- BOOM SPD -->
        <div class="dial-container" id="dialA7">
            <div class="dial-title">BOOM SPD</div>
            <div class="dial"><div class="dial-ptr" id="ptrA7"></div></div>
            <div class="dial-val" id="valA7">128</div>
        </div>

        <div class="btn-group">
            <button class="btn" id="btnHoseOpen">OPEN</button>
            <button class="btn" id="btnHoseClose">CLOSE</button>
        </div>

        <button class="side-btn yellow" id="btnMotion">MOTION</button>
    </div>

    <script>
        const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

        let bleDevice = null;
        let bleCharacteristic = null;
        let sendTimer = null;
        let isConnected = false;
        let isSending = false;
        let txCount = 0;

        // 12-byte packet
        const packet = new Uint8Array(12);
        packet.fill(0);          // 스위치 0x00 초기화 (00 00 00 00)
        packet.fill(127, 4, 10); // 조이스틱 중립값 127(0x7F) 설정
        packet[10] = 128;
        packet[11] = 128;

        const $ = (id) => document.getElementById(id);

        function setStatus(text, color = "#ff453a") {
            $("statusText").innerText = text;
            $("statusText").style.color = color;
        }

        function stopSending() {
            if (sendTimer !== null) {
                clearInterval(sendTimer);
                sendTimer = null;
            }
            isSending = false;
        }

        function handleDisconnected() {
            isConnected = false;
            bleCharacteristic = null;
            stopSending();
            setStatus("BLE 미연결");
            $("connectBtn").innerText = "ESP32 연결하기";
        }

        // ---------- BLE ----------
        $("connectBtn").addEventListener("click", async () => {
            if (!navigator.bluetooth) {
                setStatus("Web Bluetooth 미지원");
                alert("Bluefy 브라우저에서 실행해 주세요.");
                return;
            }

            if (isConnected && bleDevice) {
                try { bleDevice.gatt.disconnect(); } catch (_) {}
                return;
            }

            try {
                setStatus("장치 찾는 중...", "#ffcc00");
                $("connectBtn").disabled = true;

                bleDevice = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [SERVICE_UUID]
                });

                bleDevice.removeEventListener("gattserverdisconnected", handleDisconnected);
                bleDevice.addEventListener("gattserverdisconnected", handleDisconnected);

                setStatus("ESP32 연결 중...", "#ffcc00");

                const server = await bleDevice.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                bleCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

                isConnected = true;
                txCount = 0;
                $("txText").innerText = "TX: 0";
                setStatus("연결됨 (80ms)", "#30d158");
                $("connectBtn").innerText = "연결 해제";

                stopSending();

                // 80ms 주기 타이머 시작 (이 타이머만 BLE 전송을 담당)
                sendTimer = setInterval(() => {
                    sendBLEData();
                }, 80);

            } catch (error) {
                console.error("BLE 연결 실패:", error);
                handleDisconnected();
                alert("BLE 연결 실패\n" + (error?.message || error));
            } finally {
                $("connectBtn").disabled = false;
            }
        });

        // 80ms 타이머에 의해서만 호출되는 전송 전용 함수
        async function sendBLEData() {
            if (!isConnected || !bleCharacteristic || isSending) return;
            isSending = true;

            try {
                const data = packet.slice();
                const props = bleCharacteristic.properties || {};

                // Bluefy 통신 병목 방지: writeWithoutResponse 우선 사용
                if (props.writeWithoutResponse && typeof bleCharacteristic.writeValueWithoutResponse === "function") {
                    await bleCharacteristic.writeValueWithoutResponse(data);
                } else if (typeof bleCharacteristic.writeValueWithResponse === "function") {
                    await bleCharacteristic.writeValueWithResponse(data);
                } else if (typeof bleCharacteristic.writeValue === "function") {
                    await bleCharacteristic.writeValue(data);
                }

                txCount++;
                $("txText").innerText = "TX: " + txCount;

            } catch (error) {
                console.error("BLE 전송 에러:", error);
                if (bleDevice?.gatt && !bleDevice.gatt.connected) {
                    handleDisconnected();
                }
            } finally {
                isSending = false;
            }
        }

        // ---------- JOYSTICKS ----------
        function initJoystick(areaId, knobId, valId, labelX, labelY, idxX, idxY) {
            const area = $(areaId);
            const knob = $(knobId);
            const valDisp = $(valId);

            const RADIUS = 37.5;
            let activeTouchId = null;

            function getTouchById(touchList, id) {
                for (let i = 0; i < touchList.length; i++) {
                    if (touchList[i].identifier === id) return touchList[i];
                }
                return null;
            }

            function updateStick(touch) {
                if (!touch) return;

                const rect = area.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;

                let dx = touch.clientX - cx;
                let dy = touch.clientY - cy;
                const dist = Math.hypot(dx, dy);

                if (dist > RADIUS) {
                    const scale = RADIUS / dist;
                    dx *= scale;
                    dy *= scale;
                }

                knob.style.transform = `translate(${dx}px, ${dy}px)`;

                const nx = dx / RADIUS;
                const ny = dy / RADIUS;
                const valX = Math.max(0, Math.min(255, Math.round((nx + 1) * 127)));
                const valY = Math.max(0, Math.min(255, Math.round((ny + 1) * 127)));

                // 배열 값만 업데이트 (직접 sendBLEData 호출 안 함)
                packet[idxX] = valX;
                packet[idxY] = valY;
                valDisp.innerHTML = `${labelX}: ${valX}<br>${labelY}: ${valY}`;
            }

            function resetStick() {
                activeTouchId = null;
                knob.style.transform = "translate(0px, 0px)";
                packet[idxX] = 127;
                packet[idxY] = 127;
                valDisp.innerHTML = `${labelX}: 127<br>${labelY}: 127`;
            }

            area.addEventListener("touchstart", (e) => {
                e.preventDefault();
                if (activeTouchId !== null) return;
                const touch = e.changedTouches[0];
                if (!touch) return;
                activeTouchId = touch.identifier;
                updateStick(touch);
            }, { passive: false });

            area.addEventListener("touchmove", (e) => {
                e.preventDefault();
                if (activeTouchId === null) return;
                const touch = getTouchById(e.touches, activeTouchId);
                if (touch) updateStick(touch);
            }, { passive: false });

            area.addEventListener("touchend", (e) => {
                e.preventDefault();
                if (getTouchById(e.changedTouches, activeTouchId)) resetStick();
            }, { passive: false });

            area.addEventListener("touchcancel", (e) => {
                e.preventDefault();
                resetStick();
            }, { passive: false });
        }

        initJoystick("areaLeft",   "knobLeft",   "valLeft",   "X",       "Y",       5, 4);
        initJoystick("areaCenter", "knobCenter", "valCenter", "2붐(A6)", "3붐(A5)", 9, 8);
        initJoystick("areaRight",  "knobRight",  "valRight",  "X",       "Y",       7, 6);

        // ---------- DIALS ----------
        function initDial(containerId, ptrId, valId, packetIdx) {
            const container = $(containerId);
            const ptr = $(ptrId);
            const valDisp = $(valId);
            let activeTouchId = null;
            let startY = 0;
            let startVal = 128;

            function getTouchById(touchList, id) {
                for (let i = 0; i < touchList.length; i++) {
                    if (touchList[i].identifier === id) return touchList[i];
                }
                return null;
            }

            container.addEventListener("touchstart", (e) => {
                e.preventDefault();
                const touch = e.changedTouches[0];
                if (!touch) return;
                activeTouchId = touch.identifier;
                startY = touch.clientY;
                startVal = packet[packetIdx];
            }, { passive: false });

            container.addEventListener("touchmove", (e) => {
                e.preventDefault();
                if (activeTouchId === null) return;
                const touch = getTouchById(e.touches, activeTouchId);
                if (!touch) return;

                const dy = startY - touch.clientY;
                const newVal = Math.min(255, Math.max(0, startVal + Math.round(dy * 1.5)));

                // 배열 값만 업데이트
                packet[packetIdx] = newVal;
                valDisp.innerText = newVal;
                ptr.style.transform = `rotate(${-135 + (newVal / 255) * 270}deg)`;
            }, { passive: false });

            container.addEventListener("touchend", (e) => {
                e.preventDefault();
                if (getTouchById(e.changedTouches, activeTouchId)) activeTouchId = null;
            }, { passive: false });

            container.addEventListener("touchcancel", () => {
                activeTouchId = null;
            });
        }

        initDial("dialA8", "ptrA8", "valA8", 11);
        initDial("dialA7", "ptrA7", "valA7", 10);

        // ---------- 모멘터리 버튼 (누르는 동안만 ON) ----------
        function addMomentaryButton(id, byteIdx, bitMask) {
            const btn = $(id);
            if (!btn) return;

            const press = (e) => {
                e.preventDefault();
                btn.classList.add("active");
                packet[byteIdx] |= bitMask; // 비트 세팅만 수행
            };

            const release = (e) => {
                e.preventDefault();
                btn.classList.remove("active");
                packet[byteIdx] &= (~bitMask & 0xFF); // 비트 해제만 수행
            };

            btn.addEventListener("touchstart", press, { passive: false });
            btn.addEventListener("touchend", release, { passive: false });
            btn.addEventListener("touchcancel", release, { passive: false });
        }

        // ---------- 토글형 배타적 2버튼 제어 함수 (재터치 시 OFF) ----------
        function setupToggleExclusivePair(btn1Id, btn2Id, byteIdx, mask1, mask2) {
            const btn1 = $(btn1Id);
            const btn2 = $(btn2Id);
            if (!btn1 || !btn2) return;

            btn1.addEventListener("touchstart", (e) => {
                e.preventDefault();
                const isOn = (packet[byteIdx] & mask1) !== 0;

                if (isOn) {
                    // 이미 켜진 경우 -> 끔 (OFF)
                    packet[byteIdx] &= ~mask1;
                    btn1.classList.remove("active");
                } else {
                    // 꺼진 경우 -> 상대방 끄고 자신 켬 (ON)
                    packet[byteIdx] &= ~mask2;
                    packet[byteIdx] |= mask1;
                    btn2.classList.remove("active");
                    btn1.classList.add("active");
                }
            }, { passive: false });

            btn2.addEventListener("touchstart", (e) => {
                e.preventDefault();
                const isOn = (packet[byteIdx] & mask2) !== 0;

                if (isOn) {
                    // 이미 켜진 경우 -> 끔 (OFF)
                    packet[byteIdx] &= ~mask2;
                    btn2.classList.remove("active");
                } else {
                    // 꺼진 경우 -> 상대방 끄고 자신 켬 (ON)
                    packet[byteIdx] &= ~mask1;
                    packet[byteIdx] |= mask2;
                    btn1.classList.remove("active");
                    btn2.classList.add("active");
                }
            }, { passive: false });
        }

        // 1) BOOM / OUT (4번 바이트 / index 3): BOOM(0x02), OUT(0x20) - 토글 적용
        setupToggleExclusivePair("btnBoom", "btnOut", 3, 0x02, 0x20);

        // 2) 정전 / 역전 (3번 바이트 / index 2): 정전(0x08), 역전(0x10) - 토글 적용
        setupToggleExclusivePair("btnPumpFwd", "btnPumpRev", 2, 0x08, 0x10);

        // Momentary switches (누르고 있을 때만 동작)
        addMomentaryButton("btnStart",     3, 0x01);
        addMomentaryButton("btnMotion",    2, 0x80);
        addMomentaryButton("btnRpmUp",     2, 0x02);
        addMomentaryButton("btnRpmDn",     2, 0x04);
        addMomentaryButton("btnGSS",       3, 0x10);
        addMomentaryButton("btnHorn",      2, 0x20);
        addMomentaryButton("btnJump",      2, 0x40);
        addMomentaryButton("btnHoseOpen",  3, 0x40);
        addMomentaryButton("btnHoseClose", 3, 0x80);

        // Bluefy 터치 스크롤 방지
        document.addEventListener("touchmove", (e) => {
            if (e.target.closest(".btn, .side-btn, .btn-gss, .stick-area, .dial-container")) {
                e.preventDefault();
            }
        }, { passive: false });
    </script>
</body>
</html>
