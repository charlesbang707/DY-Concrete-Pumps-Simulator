<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ESP32 펌프카 컨트롤러 (3-Joystick)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        
        body, html {
            width: 100vw; height: 100vh;
            background-color: #121212; color: #fff; font-family: sans-serif;
            overflow: hidden; touch-action: none; display: flex; flex-direction: column;
        }

        /* 상단 상태 바 */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            height: 10vh; padding: 0 15px; background-color: #1a1a1a; border-bottom: 1px solid #333;
        }
        .status { color: #ff453a; font-weight: bold; font-size: 1.1rem; }
        .btn-connect { background-color: #007aff; color: white; border: none; padding: 8px 16px; border-radius: 5px; font-weight: bold; cursor: pointer; }

        /* 중앙 조이스틱 영역 (3개 나란히) */
        .joystick-container {
            display: flex; justify-content: space-between; align-items: center;
            height: 50vh; padding: 10px; gap: 10px;
        }
        .joystick-box {
            flex: 1; height: 100%; background-color: #1e1e1e; border-radius: 10px; border: 1px solid #333;
            display: flex; flex-direction: column; align-items: center; position: relative; padding-top: 10px;
        }
        .joystick-title { color: #aaa; font-size: 0.85rem; font-weight: bold; margin-bottom: auto; }
        .joystick-values { position: absolute; bottom: 10px; color: #ffcc00; font-size: 0.8rem; text-align: center; line-height: 1.2; }
        
        .stick-area {
            width: 140px; height: 140px; border-radius: 50%; background-color: #111; border: 2px solid #555;
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            display: flex; justify-content: center; align-items: center; touch-action: none;
        }
        .stick-knob {
            width: 50px; height: 50px; border-radius: 50%; background: radial-gradient(circle, #ddd, #888);
            border: 2px solid #fff; position: absolute; pointer-events: none;
        }

        /* 하단 컨트롤 패널 */
        .control-panel {
            display: flex; justify-content: space-between; align-items: center;
            height: 40vh; padding: 10px; background-color: #151515; border-top: 1px solid #333; gap: 8px;
        }

        .side-btn { 
            writing-mode: vertical-rl; text-orientation: upright; font-weight: bold; font-size: 14px; letter-spacing: 2px;
            background-color: #34c759; color: #000; border: none; border-radius: 5px; height: 90%; width: 45px; 
        }
        .side-btn.yellow { background-color: #ffcc00; }
        
        .btn-group { display: flex; flex-direction: column; gap: 8px; justify-content: center; }
        .btn { background-color: #333; color: white; border: 1px solid #555; padding: 8px 5px; border-radius: 5px; font-size: 11px; font-weight: bold; min-width: 50px; }
        .btn.active { background-color: #0a84ff; border-color: #64d2ff; }
        
        .btn-gss {
            background-color: #ff453a; border-radius: 50%; width: 70px; height: 70px; 
            font-size: 18px; font-weight: 900; color: white; border: 4px solid white; box-shadow: 0 0 15px rgba(255,69,58,0.6);
        }

        .dial-container { display: flex; flex-direction: column; align-items: center; }
        .dial-title { font-size: 10px; color: #aaa; margin-bottom: 5px; }
        .dial { width: 50px; height: 50px; border-radius: 50%; border: 3px solid #ffcc00; position: relative; background: #111; }
        .dial-ptr { width: 3px; height: 20px; background: #ffcc00; position: absolute; top: 3px; left: 22px; transform-origin: bottom center; transform: rotate(-135deg); }
        .dial-val { color: #ffcc00; margin-top: 5px; font-size: 12px; font-weight:bold; }
    </style>
</head>
<body>

    <div class="header">
        <div class="status" id="statusText">BLE 미연결</div>
        <button class="btn-connect" id="connectBtn">ESP32 연결하기</button>
    </div>

    <!-- 조이스틱 3개 영역 -->
    <div class="joystick-container">
        <!-- 1. 좌측 조이스틱 -->
        <div class="joystick-box">
            <div class="joystick-title">좌측 (4붐/5붐)</div>
            <div class="stick-area" id="areaLeft"><div class="stick-knob" id="knobLeft"></div></div>
            <div class="joystick-values" id="valLeft">X: 128<br>Y: 128</div>
        </div>
        <!-- 2. 중앙 조이스틱 (신규 추가) -->
        <div class="joystick-box">
            <div class="joystick-title">중앙 (2붐/3붐)</div>
            <div class="stick-area" id="areaCenter"><div class="stick-knob" id="knobCenter"></div></div>
            <div class="joystick-values" id="valCenter">2붐(A6): 128<br>3붐(A5): 128</div>
        </div>
        <!-- 3. 우측 조이스틱 -->
        <div class="joystick-box">
            <div class="joystick-title">우측 (스윙/1붐)</div>
            <div class="stick-area" id="areaRight"><div class="stick-knob" id="knobRight"></div></div>
            <div class="joystick-values" id="valRight">X: 128<br>Y: 128</div>
        </div>
    </div>

    <!-- 하단 컨트롤 영역 -->
    <div class="control-panel">
        <button class="side-btn" id="btnStart">START</button>
        
        <div class="btn-group">
            <button class="btn active" id="btnBoom">BOOM</button>
            <button class="btn" id="btnOut">OUT</button>
        </div>
        <div class="btn-group">
            <button class="btn" disabled>D9</button>
            <button class="btn" disabled>D12</button>
        </div>
        <div class="btn-group">
            <button class="btn" id="btnRpmUp">+ RPM</button>
            <button class="btn" id="btnRpmDn">- RPM</button>
        </div>
        
        <!-- 토출량 -->
        <div class="dial-container" id="dialA8">
            <div class="dial-title">토출량(A8)</div>
            <div class="dial"><div class="dial-ptr" id="ptrA8"></div></div>
            <div class="dial-val" id="valA8">128</div>
        </div>

        <button class="btn-gss" id="btnGSS">GSS</button>

        <div class="btn-group">
            <button class="btn" id="btnHorn">HORN</button>
            <button class="btn" id="btnJump">JUMP</button>
        </div>
        <div class="btn-group">
            <button class="btn active" id="btnPumpFwd">정전</button>
            <button class="btn" id="btnPumpRev">역전</button>
        </div>

        <!-- BOOM SPD -->
        <div class="dial-container" id="dialA7">
            <div class="dial-title">BOOM SPD</div>
            <div class="dial"><div class="dial-ptr" id="ptrA7"></div></div>
            <div class="dial-val" id="valA7">128</div>
        </div>

        <div class="btn-group">
            <button class="btn" id="btnHoseOpen">OPEN</button>
            <button class="btn" id="btnHoseClose">CLOSE</button>
        </div>

        <button class="side-btn yellow" id="btnMotion">MOTION</button>
    </div>

    <script>
        // 기존 펌웨어에 맞춰진 정확한 UUID 복구
        const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

        let bleDevice = null;
        let bleCharacteristic = null;
        let sendInterval = null;
        let isConnected = false;
        let isSending = false;
        const encoder = new TextEncoder();

        // 12바이트 패킷 (조이스틱 3개 포함 4~11번 인덱스는 128로 초기화)
        let packet = new Uint8Array(12);
        packet[0] = 0x00; packet[1] = 0x00; packet[2] = 0x00; packet[3] = 0x02; // BOOM 기본값
        packet.fill(128, 4, 12); 

        // BLE 연결 로직
        document.getElementById('connectBtn').addEventListener('click', async () => {
            if (isConnected) { bleDevice.gatt.disconnect(); return; }
            try {
                document.getElementById('statusText').innerText = "장치 찾는 중...";
                // acceptAllDevices: true 로 복구하여 모든 장치가 다시 검색되도록 함
                bleDevice = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [SERVICE_UUID]
                });

                const server = await bleDevice.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                bleCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);
                
                isConnected = true;
                document.getElementById('statusText').innerText = "연결됨 (80ms)";
                document.getElementById('statusText').style.color = "#30d158";
                document.getElementById('connectBtn').innerText = "연결 해제";
                
                // 80ms 타이머 시작
                if (sendInterval) clearInterval(sendInterval);
                sendInterval = setInterval(sendBLEData, 80);

                bleDevice.addEventListener('gattserverdisconnected', () => {
                    isConnected = false;
                    clearInterval(sendInterval);
                    document.getElementById('statusText').innerText = "BLE 미연결";
                    document.getElementById('statusText').style.color = "#ff453a";
                    document.getElementById('connectBtn').innerText = "ESP32 연결하기";
                });
            } catch (error) {
                alert("BLE 연결 실패: " + error);
                document.getElementById('statusText').innerText = "연결 실패";
            }
        });

        // 데이터 전송 로직 (80ms 간격으로 실행됨)
        async function sendBLEData() {
            if (!isConnected || !bleCharacteristic || isSending) return;
            isSending = true;
            try {
                let hexStr = Array.from(packet).map(b => b.toString(16).padStart(2, '0').toUpperCase()).join(" ") + "\n";
                await bleCharacteristic.writeValueWithoutResponse(encoder.encode(hexStr));
            } catch (e) {
                console.error("전송 에러:", e);
            } finally {
                isSending = false;
            }
        }

        // 터치 바운스/스크롤 원천 차단
        document.addEventListener('touchmove', (e) => { e.preventDefault(); }, { passive: false });

        // --- 조이스틱 제어 로직 (3개 공통) ---
        function initJoystick(areaId, knobId, valId, labelX, labelY, idxX, idxY) {
            const area = document.getElementById(areaId);
            const knob = document.getElementById(knobId);
            const valDisp = document.getElementById(valId);
            const maxRadius = 45;

            area.addEventListener('touchmove', (e) => {
                const rect = area.getBoundingClientRect();
                const dx = e.touches[0].clientX - (rect.left + rect.width/2);
                const dy = e.touches[0].clientY - (rect.top + rect.height/2);
                const dist = Math.hypot(dx, dy);

                let nx = dx / maxRadius, ny = dy / maxRadius;
                if (dist > maxRadius) { nx /= (dist/maxRadius); ny /= (dist/maxRadius); }

                knob.style.transform = `translate(${nx * maxRadius}px, ${ny * maxRadius}px)`;

                const valX = Math.round((nx + 1) * 127.5);
                const valY = Math.round((ny + 1) * 127.5);
                packet[idxX] = valX; packet[idxY] = valY;
                valDisp.innerHTML = `${labelX}: ${valX}<br>${labelY}: ${valY}`;
            }, { passive: false });

            area.addEventListener('touchend', () => {
                knob.style.transform = `translate(0px, 0px)`;
                packet[idxX] = 128; packet[idxY] = 128;
                valDisp.innerHTML = `${labelX}: 128<br>${labelY}: 128`;
            });
        }

        // 패킷 인덱스 매핑: 좌측(4붐/5붐), 중앙(2붐/3붐), 우측(스윙/1붐)
        initJoystick('areaLeft', 'knobLeft', 'valLeft', 'X', 'Y', 5, 4);
        initJoystick('areaCenter', 'knobCenter', 'valCenter', '2붐(A6)', '3붐(A5)', 9, 8);
        initJoystick('areaRight', 'knobRight', 'valRight', 'X', 'Y', 7, 6);

        // --- 다이얼 제어 로직 (토출량, BOOM SPD) ---
        function initDial(containerId, ptrId, valId, packetIdx) {
            const container = document.getElementById(containerId);
            const ptr = document.getElementById(ptrId);
            const valDisp = document.getElementById(valId);
            let startY = 0, startVal = 128;

            container.addEventListener('touchstart', (e) => { startY = e.touches[0].clientY; startVal = packet[packetIdx]; }, {passive:false});
            container.addEventListener('touchmove', (e) => {
                let dy = startY - e.touches[0].clientY;
                let newVal = Math.min(255, Math.max(0, startVal + Math.round(dy * 1.5)));
                packet[packetIdx] = newVal;
                valDisp.innerText = newVal;
                ptr.style.transform = `rotate(${-135 + (newVal / 255) * 270}deg)`;
            }, {passive:false});
        }
        initDial('dialA8', 'ptrA8', 'valA8', 11);
        initDial('dialA7', 'ptrA7', 'valA7', 10);

        // --- 단순 버튼 이벤트 ---
        function bindBtn(id, byteIdx, bitMask) {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', () => { btn.classList.add('active'); packet[byteIdx] |= bitMask; });
            btn.addEventListener('touchend', () => { btn.classList.remove('active'); packet[byteIdx] &= ~bitMask; });
        }
        bindBtn('btnStart', 3, 0x01);
        bindBtn('btnMotion', 2, 0x80);
        bindBtn('btnRpmUp', 2, 0x02);
        bindBtn('btnRpmDn', 2, 0x04);
        bindBtn('btnGSS', 3, 0x10);
        bindBtn('btnHorn', 2, 0x20);
        bindBtn('btnJump', 2, 0x40);
        bindBtn('btnHoseOpen', 3, 0x40);
        bindBtn('btnHoseClose', 3, 0x80);
    </script>
</body>
</html>
